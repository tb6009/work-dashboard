<svg xmlns="http://www.w3.org/2000/svg" width="594mm" height="841mm" viewBox="0 0 1684 2384"><style>@font-face{font-family:Pretendard;src:url(PretendardVariable.ttf)}text{font-family:Pretendard,sans-serif}</style><rect width="1684" height="2384" fill="#f6f4e9"/><text x="75" y="95" fill="#12292a" font-size="17" font-weight="400">PRACTICE ATLAS / MIGRATION STUDY</text><text x="75" y="235" fill="#12292a" font-size="85" font-weight="800">이미지 작업이</text><text x="75" y="340" fill="#12292a" font-size="85" font-weight="800">하나의 그룹이 되다.</text><text x="80" y="408" fill="#12292a" font-size="21" font-weight="400">2026.08.15  /  4 SOURCE GROUPS → 13_Image  /  9 PATHS</text><text x="80" y="490" fill="#12292a" font-size="18" font-weight="400">리본 폭 = 이동 매핑표의 경로 항목 수. 파일 수·용량·토큰·비용이 아닙니다.</text><path d="M 290 1750 C 290 1400 787.0 1380 787.0 1140" fill="none" stroke="#ee526c" stroke-width="48" opacity=".65"/><path d="M 787.0 1140 L 787.0 735" fill="none" stroke="#ee526c" stroke-width="48" opacity=".65"/><text x="195" y="1820" fill="#ee526c" font-size="21" font-weight="600">03 / 학교·산학</text><text x="195" y="1850" fill="#12292a" font-size="17" font-weight="400">3개 경로</text><text x="190" y="1890" fill="#12292a" font-size="15" font-weight="400">Image Generation</text><text x="190" y="1920" fill="#12292a" font-size="15" font-weight="400">접시팬_마케팅</text><text x="190" y="1950" fill="#12292a" font-size="15" font-weight="400">접시팬_마케팅02</text><path d="M 590 1750 C 590 1400 827.0 1380 827.0 1140" fill="none" stroke="#247cdf" stroke-width="32" opacity=".65"/><path d="M 827.0 1140 L 827.0 735" fill="none" stroke="#247cdf" stroke-width="32" opacity=".65"/><text x="495" y="1820" fill="#247cdf" font-size="21" font-weight="600">06 / 개인 프로젝트</text><text x="495" y="1850" fill="#12292a" font-size="17" font-weight="400">2개 경로</text><text x="490" y="1890" fill="#12292a" font-size="15" font-weight="400">0694_SYNC프레임워크_자동화</text><text x="490" y="1920" fill="#12292a" font-size="15" font-weight="400">067_김현정아카데미_포스터</text><path d="M 890 1750 C 890 1400 867.0 1380 867.0 1140" fill="none" stroke="#8d5be7" stroke-width="48" opacity=".65"/><path d="M 867.0 1140 L 867.0 735" fill="none" stroke="#8d5be7" stroke-width="48" opacity=".65"/><text x="795" y="1820" fill="#8d5be7" font-size="21" font-weight="600">08 / 외부 프로젝트</text><text x="795" y="1850" fill="#12292a" font-size="17" font-weight="400">3개 경로</text><text x="790" y="1890" fill="#12292a" font-size="15" font-weight="400">089_마케팅_agent</text><text x="790" y="1920" fill="#12292a" font-size="15" font-weight="400">0810_SKF</text><text x="790" y="1950" fill="#12292a" font-size="15" font-weight="400">088_인사이드 프로파일러</text><path d="M 1190 1750 C 1190 1400 899.0 1380 899.0 1140" fill="none" stroke="#05a984" stroke-width="16" opacity=".65"/><path d="M 899.0 1140 L 899.0 735" fill="none" stroke="#05a984" stroke-width="16" opacity=".65"/><text x="1095" y="1820" fill="#05a984" font-size="21" font-weight="600">09 / 몸과마음의과학</text><text x="1095" y="1850" fill="#12292a" font-size="17" font-weight="400">1개 경로</text><text x="1090" y="1890" fill="#12292a" font-size="15" font-weight="400">092_영상과제</text><text x="950" y="1010" fill="#12292a" font-size="56" font-weight="700">13_Image</text><text x="950" y="1050" fill="#12292a" font-size="20" font-weight="400">기존 4개 그룹의 이미지 작업 집결</text><text x="950" y="1090" fill="#12292a" font-size="35" font-weight="300">3 + 2 + 3 + 1 = 9</text><text x="720" y="680" fill="#12292a" font-size="24" font-weight="600">새 이미지 작업 그룹</text><text x="80" y="2080" fill="#12292a" font-size="24" font-weight="700">읽는 법</text><text x="80" y="2125" fill="#12292a" font-size="18" font-weight="400">아래는 이동 전 소속, 위는 이동 후 소속입니다. 모든 리본은 8월 15일 사건을 나타냅니다.</text><text x="80" y="2160" fill="#12292a" font-size="18" font-weight="400">표에 기록된 하위 경로도 1개 항목으로 집계합니다. 독립 프로젝트 수와 일치한다고 해석하지 않습니다.</text><text x="80" y="2195" fill="#12292a" font-size="18" font-weight="400">후속 분리: 09.24 제작 사례를 1302로 이관 / 10.09 날짜별 제작 폴더 7개를 1302에 집결</text><text x="80" y="2310" fill="#12292a" font-size="14" font-weight="400">SOURCE / PROJECTS.md:67,68,99,100,113,114,115,123 + 13_Image/_이관점검/linkcheck.py:22</text><text x="80" y="2340" fill="#12292a" font-size="14" font-weight="400">이동 경로 일부의 시각화 / 전수 이관량 아님 / A1 PORTRAIT 594 × 841mm</text></svg>