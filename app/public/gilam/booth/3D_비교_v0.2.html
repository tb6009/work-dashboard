<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기람테크 · 3D 부스 비교</title><style>
*{box-sizing:border-box;font-style:normal}body{margin:0;background:#ebe7ee;color:#251c2e;font-family:Pretendard,Apple SD Gothic Neo,sans-serif}header{padding:22px;background:white}h1{font-size:24px;margin:0}p{margin:10px 0}button,a{font:inherit;color:#502477}button{background:white;padding:7px 10px;border:1px solid #a89bb0;cursor:pointer}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;padding:14px}article{background:#faf8fb;border:1px solid #ccc1d4;overflow:hidden}h2{font-size:19px;margin:14px}.view{height:clamp(230px,30vw,480px);perspective:900px;position:relative;overflow:hidden;touch-action:none;cursor:grab;user-select:none;container-type:inline-size}.view:active{cursor:grabbing}.model,.wall,.floor{transform-style:preserve-3d;position:absolute}.model{width:70cqw;height:35cqw;left:15%;top:28%;transform:scale(var(--zoom,1)) rotateX(var(--pitch,-16deg)) rotateY(var(--yaw,-14deg))}.wall{display:flex;height:35cqw;backface-visibility:hidden;background:#f8f6f9;outline:1px solid #65576c}.wall img{display:block;width:17.5cqw;height:35cqw;pointer-events:none}.back{transform:translateZ(-17.5cqw)}.left,.right{width:35cqw}.left{transform-origin:left;transform:translateZ(17.5cqw) rotateY(90deg)}.right{left:70cqw;transform-origin:left;transform:translateZ(-17.5cqw) rotateY(-90deg)}.floor{width:70cqw;height:35cqw;background:linear-gradient(90deg,#d8d1de 49.8%,#a99cb2 50%,#d8d1de 50.2%);top:35cqw;transform-origin:top;transform:translateZ(-17.5cqw) rotateX(90deg)}@media(max-width:760px){main{grid-template-columns:1fr}.view{height:72vw}} .card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-right:12px}.selected{position:fixed;inset:0;z-index:10;background:#faf8fb;display:flex;flex-direction:column;align-items:center}.selected .card-head{width:min(100%,1200px)}.selected .view{width:min(100%,calc((100dvh - 100px)*1.7),1450px);height:auto;flex:1}.selected .model{top:23%}.selected .focus{margin-right:12px}</style><header><h1>기람테크 · 3D 부스 비교</h1><p>부스를 드래그하면 세 디자인이 같은 각도로 회전합니다. 6×3m 전면 개방 배치 제안을 적용했습니다.</p><button data-y="-35">왼쪽 사선</button> <button data-y="0">정면</button> <button data-y="35">오른쪽 사선</button> <button id="zoom" aria-pressed="false">확대</button> <a href="index.html">고정 시점 보기</a></header><main><article><div class="card-head"><h2>디자인 1</h2><button class="focus">전체 화면</button></div><div class="view" aria-label="디자인 1 부스. 드래그하여 회전"><div class="model"><div class="floor"></div><div class="wall back"><img src="1/1.svg" alt="P1" draggable="false"><img src="1/2.svg" alt="P2" draggable="false"><img src="1/3.svg" alt="P3" draggable="false"><img src="1/4.svg" alt="P4" draggable="false"></div><div class="wall left"><img src="1/5.svg" alt="P5" draggable="false"><img src="1/6.svg" alt="P6" draggable="false"></div><div class="wall right"><img src="1/7.svg" alt="P7" draggable="false"><img src="1/8.svg" alt="P8" draggable="false"></div></div></div></article><article><div class="card-head"><h2>디자인 2</h2><button class="focus">전체 화면</button></div><div class="view" aria-label="디자인 2 부스. 드래그하여 회전"><div class="model"><div class="floor"></div><div class="wall back"><img src="2/1.svg" alt="P1" draggable="false"><img src="2/2.svg" alt="P2" draggable="false"><img src="2/3.svg" alt="P3" draggable="false"><img src="2/4.svg" alt="P4" draggable="false"></div><div class="wall left"><img src="2/5.svg" alt="P5" draggable="false"><img src="2/6.svg" alt="P6" draggable="false"></div><div class="wall right"><img src="2/7.svg" alt="P7" draggable="false"><img src="2/8.svg" alt="P8" draggable="false"></div></div></div></article><article><div class="card-head"><h2>디자인 3</h2><button class="focus">전체 화면</button></div><div class="view" aria-label="디자인 3 부스. 드래그하여 회전"><div class="model"><div class="floor"></div><div class="wall back"><img src="3/1.svg" alt="P1" draggable="false"><img src="3/2.svg" alt="P2" draggable="false"><img src="3/3.svg" alt="P3" draggable="false"><img src="3/4.svg" alt="P4" draggable="false"></div><div class="wall left"><img src="3/5.svg" alt="P5" draggable="false"><img src="3/6.svg" alt="P6" draggable="false"></div><div class="wall right"><img src="3/7.svg" alt="P7" draggable="false"><img src="3/8.svg" alt="P8" draggable="false"></div></div></div></article></main><script>
let yaw=-14,pitch=-16,zoom=1;const css=document.documentElement.style;function draw(){css.setProperty('--yaw',yaw+'deg');css.setProperty('--pitch',pitch+'deg');css.setProperty('--zoom',zoom)}
document.querySelectorAll('[data-y]').forEach(b=>b.onclick=()=>{yaw=Number(b.dataset.y);pitch=-16;draw()});document.querySelector('#zoom').onclick=e=>{zoom=zoom===1?1.19:1;e.target.setAttribute('aria-pressed',zoom!==1);e.target.textContent=zoom===1?'확대':'원래 크기';draw()};
document.querySelectorAll('.view').forEach(v=>{let point;v.onpointerdown=e=>{if(e.button!==0)return;point=[e.clientX,e.clientY];v.setPointerCapture(e.pointerId)};v.onpointermove=e=>{if(!point)return;yaw=Math.max(-65,Math.min(65,yaw+(e.clientX-point[0])*.38));pitch=Math.max(-55,Math.min(4,pitch-(e.clientY-point[1])*.30));point=[e.clientX,e.clientY];draw()};v.onlostpointercapture=()=>{point=null}});

let selected=null;
function closeFocus(){if(!selected)return;const card=selected;selected=null;card.classList.remove('selected');card.querySelector('.focus').textContent='전체 화면';if(document.fullscreenElement===card)document.exitFullscreen().catch(()=>{});card.querySelector('.focus').focus()}
document.querySelectorAll('.focus').forEach(button=>button.onclick=()=>{if(selected){closeFocus();return}selected=button.closest('article');selected.classList.add('selected');button.textContent='세 디자인 비교로 돌아가기';if(selected.requestFullscreen)selected.requestFullscreen().catch(()=>{})});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)closeFocus()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selected)closeFocus()});
</script></html>
