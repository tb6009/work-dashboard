e="white-space:pre-wrap;font:18px/1.5 system-ui"></pre></main><script>const docs={"e0af2066db965d0c": {"name": "01_엑셀원문과이미지_대응표.md", "text": "# 엑셀에서는 어떻게 표현되어 있는가\n\n기준: 13_Image/1301_Image_Corpus/04_산출물/outputs/20261015_시각문법_최종수정본/2025_스토리텔링_시각문법_최종수정본.xlsx\n\n엑셀 표제·설명은 원문 그대로 옮겼다. 이미지의 위치·색·거리 수치와 감정 연결은 편집 설계다.\n\n|이미지|관찰 ID|엑셀 행|표제|설명 원문|\n|---|---|---:|---|---|\n|G01|XLSX_02_0126|1422|눈높이 앵글|피사체와 대등한 높이. 가장 자연스럽고 안정적인 시점.|\n|D02|XLSX_08_0038|5010|선명도/흐림 대비|초점이 맞은 영역과 흐릿한 영역을 극적으로 대비시켜 특정 요소에 시선을 집중시킴.|\n|R02|XLSX_03_0077|2411|자연광 / 창문광|부드러운 직사광, 따뜻한 색조, 현실적 질감|\n|R02|XLSX_08_0065|5037|얕은 피사계 심도|주 피사체는 선명하고 전경 또는 후경이 의도적으로 흐릿하게 처리됨.|\n|G02|XLSX_02_0436|1732|하이 앵글|높은 위치에서 피사체를 내려다보는 앵글.|\n|G03|XLSX_02_0179|1475|로우 앵글|낮은 위치에서 피사체를 올려다보는 앵글.|\n|G04|XLSX_02_0149|1445|더치 앵글|카메라가 기울어진 각도. 불안정, 긴장감, 역동성을 연출.|\n|D01|XLSX_08_0065|5037|얕은 피사계 심도|주 피사체는 선명하고 전경 또는 후경이 의도적으로 흐릿하게 처리됨.|\n|D03|XLSX_08_0020|4992|깊은 피사계 심도|화면의 전경, 중경, 후경 모두가 선명하게 초점이 맞추어진 상태임.|\n|K01|XLSX_06_0290|4666|Leica Natural Color|자연스러운 톤 밸런스 따뜻한 콘트라스트|\n|K02|XLSX_01_0032|32|필름 질감|따뜻한 그림자, 부드러운 그레인, 클래식한 콘트라스트|\n|K03|XLSX_08_0064|5036|차가운 필터|푸른색 계열 강조, 차분하고 감성적인 느낌.|\n|K04|XLSX_01_0101|101|고채도|색의 채도를 높게 지정하는 표현.|\n|M01|XLSX_02_0126|1422|눈높이 앵글|피사체와 대등한 높이. 가장 자연스럽고 안정적인 시점.|\n|M01|XLSX_02_0385|1681|약한 미소|볼 미세 상승, 눈가 잔주름 약함, 입꼬리 경미한 상승, 치아 비노출|\n|M01|XLSX_08_0065|5037|얕은 피사계 심도|주 피사체는 선명하고 전경 또는 후경이 의도적으로 흐릿하게 처리됨.|\n|M02|XLSX_02_0436|1732|하이 앵글|높은 위치에서 피사체를 내려다보는 앵글.|\n|M02|XLSX_02_0098|1394|비대칭 구도|피사체를 한쪽으로 치우치게 배치하여 시각적 긴장감 유도|\n|M02|XLSX_08_0020|4992|깊은 피사계 심도|화면의 전경, 중경, 후경 모두가 선명하게 초점이 맞추어진 상태임.|\n|M03|XLSX_02_0179|1475|로우 앵글|낮은 위치에서 피사체를 올려다보는 앵글.|\n|M03|XLSX_03_0092|2426|소프트 사이드라이트|방향성있는 확산광, 입체감 부여|\n|R03|XLSX_03_0077|2411|자연광 / 창문광|부드러운 직사광, 따뜻한 색조, 현실적 질감|\n|R03|XLSX_08_0065|5037|얕은 피사계 심도|주 피사체는 선명하고 전경 또는 후경이 의도적으로 흐릿하게 처리됨.|\n|Q01|XLSX_04_0014|3189|EOS 5D Mark IV|Deep portrait with natural skin tones captured by Canon EOS 5D Mark IV|\n|Q02|XLSX_01_0034|34|Fujifilm GFX 100S, X-T5, X100V|필름 사진처럼 깊고 감성적인 색감을 내고, 부드러운 질감 표현이 뛰어납니다.|\n|Q03|XLSX_06_0323|4699|Leica Q3|Premium compact travel camera; Summilux 28mm lens look natural bokeh fine color depth|\n|L01|XLSX_05_0089|4024|광각 렌즈|넓은 시야로 공간감과 배경 요소를 함께 담는 초점대|\n|L02|XLSX_06_0136|4512|표준 렌즈|왜곡이 적고 인물 비율이 자연스러운 50mm 전후 초점대|\n|L03|XLSX_06_0106|4482|망원 렌즈|원근 압축으로 배경을 붙여 보이며 피사체를 또렷이 분리|\n|F01|XLSX_01_0648|648|필름 그레인|필름 특유의 입자감을 더해 아날로그적, 거친 질감 연출.|\n|F02|XLSX_01_0648|648|필름 그레인|필름 특유의 입자감을 더해 아날로그적, 거친 질감 연출.|\n|F03|XLSX_01_0648|648|필름 그레인|필름 특유의 입자감을 더해 아날로그적, 거친 질감 연출.|\n\n## 그대로 쓰지 않은 항목\n\n- XLSX_02_0457 익스트림 하이 앵글: 높은 곳에서 올려다본다는 설명 불일치. 수업에 사용하지 않았다.\n- XLSX_01_0742 Leica Classic Chrome: 제조사·기능 혼동. 후지필름 공식 설명으로 분리했다.\n- XLSX_06_0106 망원 렌즈: 압축 표현은 촬영 거리 변화와 연결해 설명한다. 렌즈만 바꾸면 원근이 자동으로 바뀐다고 가르치지 않는다.\n- 중간 심도·중립색·친밀/고립/존재감 조합: 수업을 위해 편집한 범주이며 엑셀의 검증된 감정 규칙이 아니다.\n- PORTRA/EKTAR/TRI-X 및 PROVIA/ACROS의 제품별 정의: 엑셀에서 확인하지 못해 공식 외부 자료로 확장했다.\n", "source": "round4_수업비교_20261021/01_엑셀원문과이미지_대응표.md"}, "b228735baff731de": {"name": "01_비교검토보고서.md", "text": "# 언어 반영 / 실제 사례 반영: 11쌍 생성 결과\n\n필름 8종과 디지털 시뮬레이션 3종을 같은 기준 사진 D02에서 각각 두 조건으로 생성했다. 총 22장이다.\n\n## 무엇을 비교했는가\n\n- A: 기준 사진 + 제조사 공식 설명.\n- B: 같은 기준 사진 + 같은 공식 설명 + 사례 분석 문장 + 실제 사례 이미지.\n- “학습 반영”은 모델 가중치 재학습이 아니라 입력에 사례를 추가한 조건이다.\n- B는 문장과 사진을 동시에 추가했다. 두 요소의 기여를 분리하지 못한다.\n- 각 조건 한 번 생성했다. 같은 시드·실제 모델 버전 일치는 확인하지 못했다.\n- 추가 참조로 화이트밸런스·밝기·구도 세부가 함께 달라질 수 있다.\n\n## 관찰과 반대 설명\n\n차이가 큰 쌍도 있고 작은 쌍도 있다. B의 우위를 사전에 가정하지 않았다.\nPROVIA 100F와 800T의 B에는 차가운 기운이 나타났다. 참조 장면의 색 전이가 대안 설명이다.\n샘플의 색을 가져오는 것과 필름의 물리적 특성을 학습하는 것은 같지 않다.\nDELTA 100과 CLASSIC CHROME의 차이는 작아, 참조 추가 효과를 단정할 수 없다.\n\n## 사례별 직접 판독\n\n|사례|A/B 차이|해석의 한계|B에 추가한 관찰|\n|---|---|---|---|\n|Kodak PORTRA 400|A는 피부와 목재가 비교적 부드럽다. B는 붉은 책과 어두운 부분이 조금 더 진하게 보인다.|차이는 미세하다. B가 실제 PORTRA에 더 가깝다는 판정은 유보한다.|실제 샘플에는 선명한 주황·청록과 깊은 그림자도 있다. 금빛·파스텔만을 강제하지 않았다.|\n|Kodak GOLD 200|A는 피부·목재·창틀의 노란 기운과 햇빛 인상이 강하다. B는 따뜻함을 유지하면서 노란 기운이 줄었다.|A에서 광원·노출 인상도 달라졌다. 같은 밝기 요청이 완벽히 유지되지 않았다.|수집한 어린이 초상의 따뜻한 피부와 부드러운 배경을 참고했다. 한 장의 장면 특성이 섞였다.|\n|Kodak EKTAR 100|두 결과 모두 책의 빨강과 식물의 초록을 강조했다. 전체 인상은 비슷하다.|축소 보기에서 차이가 작다. 실제 EKTAR 정확도 향상을 판단할 수 없다.|붉은 잎·자동차와 차분한 안개 빌딩을 함께 참고했다. 모든 색의 일괄 과장을 피하도록 지시했다.|\n|Kodak TRI-X 400|두 결과 모두 흑백이다. B는 청바지·책장 그림자가 조금 더 짙게 보인다.|명암 차이와 입자 차이는 별개다. 입자 실측이나 실제 현상 결과와의 일치 여부는 확인하지 않았다.|피부·벽의 중간 회색과 짙은 검정을 함께 보도록 했다. 균일한 굵은 노이즈를 요구하지 않았다.|\n|ILFORD HP5 PLUS 400|두 결과의 구도와 회색 인상은 비슷하다. B의 피부와 어두운 옷 구분에 미세한 차이가 있다.|참고 사진이 한 장이며 실제 현상액·스캔 조건은 미확인이다.|인물 샘플에서 관찰한 부드러운 중간 회색과 밝은 배경을 추가했다.|\n|ILFORD DELTA 100|두 흑백 결과는 매우 유사하다. B의 얼굴과 컵에 약한 명암 차이가 보인다.|뚜렷한 차이를 과장하지 않는다. 한 장의 풍경 참조로 DELTA 특성을 일반화할 수 없다.|풍경 샘플의 밝은 수면·하늘과 먼 산의 회색 분리를 참고했다.|\n|FUJICHROME PROVIA 100F|A는 피부와 목재가 따뜻하고 선명하다. B는 벽·피부·회색 옷이 더 푸르게 보인다.|B의 푸른 기운은 바다 사진의 장면색 전이일 수 있다. 필름 재현이 좋아졌다는 증거가 아니다.|한 장의 바다 샘플에서 본 옅은 회청색과 작은 계조 변화를 추가했다.|\n|CineStill 800T|A는 따뜻한 실내 인상이다. B는 벽·그늘에 청록 기운이 뚜렷해졌다.|실제 참조는 인공광 역 장면이며 기준은 주광이다. 광원 차이가 섞여 직접적인 필름 성능 비교가 아니다.|실제 역 사진의 붉은 구조물과 청록색 그늘을 참고했다. 장면·네온·광원은 복사하지 않도록 지시했다.|\n|FUJIFILM PROVIA/STANDARD|A는 피부와 목재의 따뜻함이 강하다. B는 상대적으로 차갑고 맑은 색 인상이다.|공식 기능을 실행하지 않았다. 참조가 기본 장면의 화이트밸런스 인상까지 바꿀 수 있다.|같은 세 장면의 공식 출력에서 꽃·하늘·피부 색을 참고했다. PROVIA를 무보정 중립으로 정의하지 않았다.|\n|FUJIFILM CLASSIC CHROME|A와 B 모두 절제된 색과 짙은 그림자를 보인다. 두 결과의 차이는 작다.|차이가 작다는 결과도 기록한다. 추가 참조가 반드시 눈에 띄는 변화나 개선을 만들지는 않는다.|공식 출력의 차가운 그림자와 피사체별 남아 있는 색을 참고했다.|\n|FUJIFILM ACROS|두 결과 모두 흑백이며 중간 회색이 유지된다. B는 얼굴·천·책장의 밝기 분리에 미세한 차이가 있다.|밝기별 입자 알고리즘의 재현은 확인하지 않았다. 실제 ACROS 작동과 구분한다.|공식 예시의 피부·천·과일·그림자 계조를 참고했다. 균일한 노이즈를 피하도록 지시했다.|\n\n## 판정\n\n사례 참조가 일부 결과의 색·명암을 바꾸는 것은 관찰했다. 정확한 필름 재현이나 학습 효과 향상은 결론 유보다.\n공식 설명만으로도 유사한 결과를 얻는 경우와 참조 장면색이 과도하게 전이되는 경우를 함께 기록했다.\n다음 단계에서는 문장 분석만 추가하는 조건과 이미지만 추가하는 조건을 나누고 반복 생성한다.\n그 비교에서 노출·WB·포맷·현상·스캔이 일치하는 실제 기준 촬영이 필요하다.\n", "source": "round4_수업비교_20261021/language_vs_reference_20261022/01_비교검토보고서.md"}, "77437b5abe8f3481": {"name": "00_실험설계와전체프롬프트.md", "text": "# 언어 반영과 실제 사례 반영 비교\n\n같은 기준 장면 D02에서 필름 8종·디지털 모드 3종을 두 조건으로 편집한다. 총 22장이다.\n\n- A: 제조사 공식 설명만 전달한다.\n- B: 같은 설명에 사진의 분석과 실제 사례 이미지를 추가한다.\n- B는 모델 재학습이 아니다. 참조를 입력에 추가한 조건이다.\n- B는 문장과 사진을 동시에 추가한다. 어느 요소의 기여인지 분리할 수 없다.\n- 각 조건 1회이며 시드·모델 버전 통제는 미확인이다.\n- 일부 필름은 실제 사진 1장뿐이므로 대표성을 주장하지 않는다.\n- 성공 기준: 원래 구도·인물·노출 유지, 색·명암·질감만 변화, 원문과 참조에 근거해 설명 가능.\n- B가 더 정확하거나 더 아름답다는 결론을 사전에 정하지 않는다.\n\n## PORTRA400_A Kodak PORTRA 400\n\n조건: 공식 설명만\n\n공식 출처: https://imaging.kodakalaris.com/sites/default/files/files/resources/e4050_portra_400.pdf\n\n```text\nEdit INPUT IMAGE 1 only. Preserve this exact adult woman identity, pose, facial expression, grey cotton shirt, jeans, table, white mug, red closed book, green plants, bookshelves, crop, camera viewpoint, field of view and depth of field. Keep original daylight direction and exposure. Change only rendering of color, tonal gradation and subtle texture. Do not replace subjects, rearrange geometry, change camera height, add film borders, text, watermarks, light leaks or new lights. Educational interpretation of Kodak PORTRA 400. Manufacturer description: ISO400 color negative, manufacturer describes fine grain and natural skin color with good color reproduction. Use only this written manufacturer description. No real film reference images are supplied. This is AI interpretation, not physical film emulation.\n```\n\n## PORTRA400_B Kodak PORTRA 400\n\n조건: 공식 설명 + 사례 분석·사진 참조\n\n공식 출처: https://imaging.kodakalaris.com/sites/default/files/files/resources/e4050_portra_400.pdf\n\n```text\nEdit INPUT IMAGE 1 only. Preserve this exact adult woman identity, pose, facial expression, grey cotton shirt, jeans, table, white mug, red closed book, green plants, bookshelves, crop, camera viewpoint, field of view and depth of field. Keep original daylight direction and exposure. Change only rendering of color, tonal gradation and subtle texture. Do not replace subjects, rearrange geometry, change camera height, add film borders, text, watermarks, light leaks or new lights. Educational interpretation of Kodak PORTRA 400. Manufacturer description: ISO400 color negative, manufacturer describes fine leaks or new lights. Interpret FUJIFILM ACROS. Official manufacturer description: Fujifilm monochrome simulation, rich tonal gradations and sharpness, brightness-dependent grain treatment informed by sensor noise. Use the written description only, no actual output samples are supplied. Not execution of camera software.\",\n      \"reference_paths\": [\n        \"round4_수업비교_20261021/images/D02.png\"\n      ],\n      \"official_url\": \"https://www.fujifilm-x.com/global/products/film-simulation/acros/\",\n      \"analysis\": null,\n      \"case_references\": [],\n      \"evidence_strength\": \"공식 동일 장면 예시 3개\"\n    },\n    {\n      \"id\": \"SIM_ACROS_B\",\n      \"case\": \"SIM_ACROS\",\n      \"name\": \"FUJIFILM ACROS\",\n      \"type\": \"디지털 시뮬레이션\",\n      \"condition\": \"B\",\n      \"condition_name\": \"공식 설명 + 사례 분석·사진 참조\",\n      \"prompt\": \"Edit INPUT IMAGE 1 only. Preserve this exact adult woman identity, pose, facial expression, grey cotton shirt, jeans, table, white mug, red closed book, green plants, bookshelves, crop, camera viewpoint, field of view and depth of field. Keep original daylight direction and exposure. Change only rendering of color, tonal gradation and subtle texture. Do not replace subjects, rearrange geometry, change camera height, add film borders, text, watermarks, light leaks or new lights. Interpret FUJIFILM ACROS. Official manufacturer description: Fujifilm monochrome simulation, rich tonal gradations and sharpness, brightness-dependent grain treatment informed by sensor noise. Case observations: Official matched examples separate skin, fruit and cloth as middle greys while maintaining meaningful deep blacks, delicate highlight gradation and fine tone-dependent texture. Avoid treating uniform noise as the whole look; no colored tint or blanket crushed blacks. INPUTS 2 onward are official Fujifilm simulation output examples, not analog film. Borrow color/tonal rendering ONLY; no copying of people or objects. Do not alter INPUT1 scene geometry. Not model training, not execution of camera software.\",\n      \"reference_paths\": [\n        \"round4_수업비교_20261021/images/D02.png\",\n        \"round4_수업비교_20261021/fuji_simulation_references_20261022/docs/assets/ACROS_01.jpg\",\n        \"round4_수업비교_20261021/fuji_simulation_references_20261022/docs/assets/ACROS_02.jpg\",\n        \"round4_수업비교_20261021/fuji_simulation_references_20261022/docs/assets/ACROS_03.jpg\"\n      ],\n      \"official_url\": \"https://www.fujifilm-x.com/global/products/film-simulation/acros/\",\n      \"analysis\": \"Official matched examples separate skin, fruit and cloth as middle greys while maintaining meaningful deep blacks, delicate highlight gradation and fine tone-dependent texture. Avoid treating uniform noise as the whole look; no colored tint or blanket crushed blacks.\",\n      \"case_references\": [\n        {\n          \"id\": \"ACROS_01\",\n          \"path\": \"round4_수업비교_20261021/fuji_simulation_references_20261022/docs/assets/ACROS_01.jpg\",\n          \"source\": \"https://www.fujifilm-x.com/global/products/film-simulation/\"\n        },\n        {\n          \"id\": \"ACROS_02\",\n          \"path\": \"round4_수업비교_20261021/fuji_simulation_references_20261022/docs/assets/ACROS_02.jpg\",\n          \"source\": \"https://www.fujifilm-x.com/global/products/film-simulation/\"\n        },\n        {\n          \"id\": \"ACROS_03\",\n          \"path\": \"round4_수업비교_20261021/fuji_simulation_references_20261022/docs/assets/ACROS_03.jpg\",\n          \"source\": \"https://www.fujifilm-x.com/global/products/film-simulation/\"\n        }\n      ],\n      \"evidence_strength\": \"공식 동일 장면 예시 3개\"\n    }\n  ],\n  \"not_training\": true,\n  \"n_per_condition\": 1,\n  \"seed\": null,\n  \"limits\": \"B는 분석 문장과 이미지 참조를 함께 추가하므로 두 효과를 분리할 수 없다. 동일 시드·모델 버전 미확인. 미적 우위·정확도 향상 단정 금지.\"\n}", "source": "round4_수업비교_20261021/language_vs_reference_20261022/experiment_specs.json"}, "3eb7ad19bf131cb5": {"name": "필름8종_선정과설명.md", "text": "# 대표 필름 8종: 수업용 우선순위와 공식 근거\n\n기준일: 2026-10-22. 판매량·점유율·인기 순위가 아니다.\n기존 수업과의 연결, 색/흑백의 대비, 감도·네거티브/리버설·광원 조건의 다양성으로 선정했다.\n선정은 수업 설계 판단이며 제조사가 정한 순위가 아니다.\n라벨은 실제 제품 사진을 사용했다. 제조사 라벨을 AI로 다시 만들지 않았다.\n설명은 제조사 공식 페이지·기술 문서에서 확인했다. 라벨 사진 일부는 판매사·현상소 출처다.\n한 장면은 필름의 전체 색을 대표하지 않는다. 장면·노출·현상·스캔·보정을 함께 확인한다.\n라벨은 출처 자료의 포장이다. 최신 지역별 포장·판매 여부를 보증하지 않는다.\n\n|수업 순서|필름|종류|공식 설명 요약|활용 해석|먼저 볼 이유|공식 출처|\n|---|---|---|---|---|---|---|\n|1|Kodak PORTRA 400|ISO 400 · 컬러 네거티브|피부색과 장면의 색 재현, 고운 입자를 설명하는 기준.|인물·생활 장면. 금빛·파스텔을 필수 효과로 정하지 않는다.|기존 수업 인물과 바로 연결한다.|[공식](https://imaging.kodakalaris.com/sites/default/files/files/resources/e4050_portra_400.pdf) E-4050 p.1|\n|2|Kodak GOLD 200|ISO 200 · 컬러 네거티브|주광·플래시에서 색·선명도·입자의 균형을 지향한다.|일상·여행·가족 사진. 노란색 포장과 노란 사진을 혼동하지 않는다.|일상 장면의 기준을 추가한다.|[공식](https://business.kodakmoments.com/product/kodak-gold-200-film) 제품 소개|\n|3|Kodak EKTAR 100|ISO 100 · 컬러 네거티브|선명한 색과 높은 채도, 고운 입자와 경계 선명도.|색 있는 사물·풍경. 피사체마다 같은 채도 상승을 강요하지 않는다.|PORTRA와 색 분리를 비교한다.|[공식](https://www.kodak.com/en/still-film/product/professional/ektar-100-film/) 제품 소개|\n|4|Kodak TRI-X 400|ISO 400 · 흑백 네거티브|고전적인 입자 구조와 명암·경계의 표현을 비교한다.|거리·인물·기록. 증감 여부와 현상 조건을 따로 기록한다.|색에서 명암으로 관찰을 전환한다.|[공식](https://www.kodak.com/en/still-film/product/professional/tri-x-400-film/) 제품 소개|\n|5|ILFORD HP5 PLUS 400|ISO 400 · 흑백 네거티브|공식 설명은 중간 대비와 폭넓은 노출 관용도를 강조한다.|거리·기록·실내 가용광. 현상액에 따른 변화를 함께 본다.|TRI-X와 흑백 해석의 폭을 비교한다.|[공식](https://www.ilfordphoto.com/hp5-plus-35mm) Product Description|\n|6|ILFORD DELTA 100|ISO 100 · 흑백 네거티브|고운 입자와 세밀한 묘사를 지향하는 흑백 필름.|세밀한 정물·풍경·미술 사진. 400 감도 표본과 조건을 맞춘다.|흑백 안에서도 감도와 묘사를 구분한다.|[공식](https://www.ilfordphoto.com/amfile/file/download/file/3/product/680/) 2023 기술 문서 p.1|\n|7|FUJICHROME PROVIA 100F|ISO 100 · 컬러 리버설|세밀한 입자와 폭넓은 피사체의 색·계조 재현을 지향한다.|풍경·제품·인물. 디지털 PROVIA 모드와 실물 필름을 구분한다.|네거티브와 리버설, 같은 이름의 디지털 기능을 나눈다.|[공식](https://www.fujifilm.com/us/en/business/professional-photography/film/provia-100f) Overview|\n|8|CineStill 800T|ISO 800 · 텅스텐용 컬러 네거티브|저조도 인공광에서 활용하는 텅스텐 균형의 컬러 필름.|야간·실내 인공광. 광원 주변 번짐은 장면 조건과 함께 본다.|광원 색과 고감도라는 다른 축을 추가한다.|[공식](https://cinestillfilm.com/products/800tungsten-c41-36exp-35mm-high-speed-color-negative-135) 제품 설명|\n\n## 대안 구성과 미확인\n\n일상 컬러에 집중하면 ULTRAMAX 400을 넣는 구성이 가능하다.\n풍경의 고채도 리버설에 집중하면 Velvia 50을 넣는 구성이 가능하다.\n이번 8종은 서로 다른 관찰 축을 확보하기 위해 DELTA 100과 800T를 포함했다.\n현재 생산·지역별 재고·판매 순위는 선정 근거로 사용하지 않았다.\n공식 비교 실험이 없으므로 TRI-X와 HP5의 입자 우열을 정하지 않는다.\n\n## 이미지 출처와 권리\n\n### Kodak PORTRA 400\n\n- 라벨: [제품을 판매하는 CineStill의 라벨 사진](https://cinestillfilm.com/products/800tungsten-c41-36exp-35mm-high-speed-color-negative-135)\n- 실제 촬영 예시: [TDR Lab Image](https://thedarkroom.com/film/portra-400/photo-gallery/#gallery-2-3246605)\n- 필름 명시 수준: 제조사 또는 해당 필름 갤러리 표기. 네거티브 독립 검증 아님.\n- 권리: 권리자 권리 유지. 로컬 검토용. 공개 재배포 허락 미확인.\n\n### Kodak GOLD 200\n\n- 라벨: [Kodak Moments 공식 제품 사진](https://apps.kodakmoments.com/film/)\n- 실제 촬영 예시: [Wylie Bryant / 공식 제품 페이지](https://business.kodakmoments.com/product/kodak-gold-200-film)\n- 필름 명시 수준: 제조사 또는 해당 필름 갤러리 표기. 네거티브 독립 검증 아님.\n- 권리: 권리자 권리 유지. 로컬 검토용. 공개 재배포 허락 미확인.\n\n### Kodak EKTAR 100\n\n- 라벨: [제품을 판매하는 CineStill의 라벨 사진](https://cinestillfilm.com/products/800tungsten-c41-36exp-35mm-high-speed-color-negative-135)\n- 실제 촬영 예시: [TDR Lab Image](https://thedarkroom.com/film/ektar-100/photo-gallery/#gallery-2-3246392)\n- 필름 명시 수준: 제조사 또는 해당 필름 갤러리 표기. 네거티브 독립 검증 아님.\n- 권리: 권리자 권리 유지. 로컬 검토용. 공개 재배포 허락 미확인.\n\n### Kodak TRI-X 400\n\n- 라벨: [제품을 판매하는 CineStill의 라벨 사진](https://cinestillfilm.com/products/800tungsten-c41-36exp-35mm-high-speed-color-negative-135)\n- 실제 촬영 예시: [TDR Lab Image](https://thedarkroom.com/film/tri-x-400/photo-gallery/#gallery-2-3307246)\n- 필름 명시 수준: 제조사 또는 해당 필름 갤러리 표기. 네거티브 독립 검증 아님.\n- 권리: 권리자 권리 유지. 로컬 검토용. 공개 재배포 허락 미확인.\n\n### ILFORD HP5 PLUS 400\n\n- 라벨: [현상소 제품 라벨 사진](https://thedarkroom.com/film/hp5/)\n- 실제 촬영 예시: [TDR Lab Image](https://thedarkroom.com/film/hp5/)\n- 필름 명시 수준: 제조사 또는 해당 필름 갤러리 표기. 네거티브 독립 검증 아님.\n- 권리: 권리자 권리 유지. 로컬 검토용. 공개 재배포 허락 미확인.\n\n### ILFORD DELTA 100\n\n- 라벨: [현상소 제품 라벨 사진](https://thedarkroom.com/film/delta-100/)\n- 실제 촬영 예시: [TDR Lab Image](https://thedarkroom.com/film/delta-100/)\n- 필름 명시 수준: 제조사 또는 해당 필름 갤러리 표기. 네거티브 독립 검증 아님.\n- 권리: 권리자 권리 유지. 로컬 검토용. 공개 재배포 허락 미확인.\n\n### FUJICHROME PROVIA 100F\n\n- 라벨: [Fujifilm 공식 제품 사진](https://www.fujifilm.com/us/en/business/professional-photography/film/provia-100f)\n- 실제 촬영 예시: [TDR Lab Image](https://thedarkroom.com/film/provia-100f/)\n- 필름 명시 수준: 제조사 또는 해당 필름 갤러리 표기. 네거티브 독립 검증 아님.\n- 권리: 권리자 권리 유지. 로컬 검토용. 공개 재배포 허락 미확인.\n\n### CineStill 800T\n\n- 라벨: [CineStill 공식 제품 사진](https://cinestillfilm.com/products/800tungsten-c41-36exp-35mm-high-speed-color-negative-135)\n- 실제 촬영 예시: [Luka Trajkovic / 공식 제품 갤러리](https://cinestillfilm.com/products/800tungsten-c41-36exp-35mm-high-speed-color-negative-135)\n- 필름 명시 수준: 제조사 또는 해당 필름 갤러리 표기. 네거티브 독립 검증 아님.\n- 권리: 권리자 권리 유지. 로컬 검토용. 공개 재배포 허락 미확인.\n\n", "source": "round4_수업비교_20261021/film_8guide_20261022/필름8종_선정과설명.md"}, "309efbb66c1558f5": {"name": "필름8종_인용_명세서.md", "text": "# 필름 8종 인용 명세서\n\n|필름|공식 근거|위치|적용|검증|\n|---|---|---|---|---|\n|Kodak PORTRA 400|[피부색과 장면의 색 재현, 고운 입자를 설명하는 기준.](https://imaging.kodakalaris.com/sites/default/files/files/resources/e4050_portra_400.pdf)|E-4050 p.1|사양·특징 설명|공식 원문 열람. 활용·우선순위는 편집 해석|\n|Kodak GOLD 200|[주광·플래시에서 색·선명도·입자의 균형을 지향한다.](https://business.kodakmoments.com/product/kodak-gold-200-film)|제품 소개|사양·특징 설명|공식 원문 열람. 활용·우선순위는 편집 해석|\n|Kodak EKTAR 100|[선명한 색과 높은 채도, 고운 입자와 경계 선명도.](https://www.kodak.com/en/still-film/product/professional/ektar-100-film/)|제품 소개|사양·특징 설명|공식 원문 열람. 활용·우선순위는 편집 해석|\n|Kodak TRI-X 400|[고전적인 입자 구조와 명암·경계의 표현을 비교한다.](https://www.kodak.com/en/still-film/product/professional/tri-x-400-film/)|제품 소개|사양·특징 설명|공식 원문 열람. 활용·우선순위는 편집 해석|\n|ILFORD HP5 PLUS 400|[공식 설명은 중간 대비와 폭넓은 노출 관용도를 강조한다.](https://www.ilfordphoto.com/hp5-plus-35mm)|Product Description|사양·특징 설명|공식 원문 열람. 활용·우선순위는 편집 해석|\n|ILFORD DELTA 100|[고운 입자와 세밀한 묘사를 지향하는 흑백 필름.](https://www.ilfordphoto.com/amfile/file/download/file/3/product/680/)|2023 기술 문서 p.1|사양·특징 설명|공식 원문 열람. 활용·우선순위는 편집 해석|\n|FUJICHROME PROVIA 100F|[세밀한 입자와 폭넓은 피사체의 색·계조 재현을 지향한다.](https://www.fujifilm.com/us/en/business/professional-photography/film/provia-100f)|Overview|사양·특징 설명|공식 원문 열람. 활용·우선순위는 편집 해석|\n|CineStill 800T|[저조도 인공광에서 활용하는 텅스텐 균형의 컬러 필름.](https://cinestillfilm.com/products/800tungsten-c41-36exp-35mm-high-speed-color-negative-135)|제품 설명|사양·특징 설명|공식 원문 열람. 활용·우선순위는 편집 해석|\n", "source": "round4_수업비교_20261021/film_8guide_20261022/필름8종_인용_명세서.md"}, "b2c5e3549040d02f": {"name": "검토보고서.md", "text": "# 실제 필름 샘플 36장과 AI 이미지 검토\n\n검토일: 2026-10-22. PORTRA 400·EKTAR 100·TRI-X 400 각 12장.\n\n## 확인 수준과 한계\n\nThe Darkroom의 해당 필름 갤러리에 게시된 현상소 샘플과 제출 사진을 수집했다.\n촬영자와 갤러리가 필름을 명시한 자료이며, 네거티브를 독립 검증하지 않았다.\n같은 현상소에 모인 비확률 표본이다. 필름별 대표 분포나 인과 효과를 추정하지 않는다.\n원본 파일·해시·픽셀 크기·이미지 URL·출처 페이지·촬영자·캡션은 references.json에 보관했다.\n공개 재배포 허락은 미확인이다. 저작권자와 워터마크를 유지하며 로컬 검토용으로 보관한다.\n\n## 색과 입자를 판단하는 방법\n\n웹 스캔은 촬영 장면, 노출, 현상, 스캐너와 보정이 함께 만든 결과다.\n색 변환을 보정한 표준 테스트 차트가 없으므로, 색차 수치와 필름별 LUT를 산출하지 않았다.\n서로 다른 장면의 평균 채도는 피사체 차이와 섞이므로 필름 순위로 사용하지 않았다.\n작은 JPEG의 요철에는 입자, 압축, 스캔 노이즈와 선명화가 섞일 수 있다.\n원본 픽셀 보기와 확대 보기를 구분한다. 서로 다른 포맷의 입자 크기를 같은 화면 크기만으로 비교하지 않는다.\n\n## 대안 설명\n\n1. 차이는 필름의 색·계조 특성에서 일부 발생했을 수 있다.\n2. 차이는 광원·피사체·노출·현상·스캔·보정에서 발생했을 수 있다.\n3. AI는 필름의 물리적 결과 대신 학습된 사진 스타일을 조합했을 수 있다.\n\n현재 표본만으로 세 설명의 기여도를 분리할 수 없다.\nPORTRA의 강한 주황 옷, EKTAR의 안개 빌딩은 단순한 스타일 공식에 대한 반례다.\n\n## Kodak PORTRA 400\n\n공식 근거: [Kodak PORTRA 400](https://imaging.kodakalaris.com/sites/default/files/files/resources/e4050_portra_400.pdf), E-4050, 2016, p.1 / Technology Benefit\n\nISO 400 컬러 네거티브. 공식 문서는 피부색 재현·색 재현·고운 입자를 강조한다.\n\n관찰: 이번 12장에는 민트색 벽, 강한 주황 옷, 청색 하늘과 깊은 그림자가 함께 있다. 항상 베이지·저채도·낮은 대비라고 정의하면 실제 사례를 놓친다.\n\n기존 AI F01의 문제: F01은 금빛 창광과 매끈한 피부를 더해 따뜻한 인물 사진의 관습을 강조했다. 실제 PORTRA 샘플 범위를 대표하지 못한다.\n\n수정 지시안(아직 새 필름 이미지를 생성하지 않음):\n\n> Keep neutral believable skin, restrained but not globally muted object colors; preserve local contrast and subtle scan-like irregularity. No mandatory golden tint, pastel wash, lifted blacks, light leaks or coarse grain. Describe lighting separately from film. Educational interpretation, not calibrated film emulation.\n\n|샘플|촬영자|장면|색·계조 관찰|질감·혼입 조건|출처|\n|---|---|---|---|---|---|\n|PORTRA400_01|TDR Lab Image|카페 외관|민트 벽·갈색 목재·어두운 주차장|밝고 어두운 영역의 질감 차이. 그림자 정보가 제한된다.|[갤러리](https://thedarkroom.com/film/portra-400/photo-gallery/#gallery-2-3246607) · [이미지](https://thedarkroom.com/app/uploads/2019/07/Portra400-Xs-9833-28-679x1024.jpg)|\n|PORTRA400_02|TDR Lab Image|지붕과 벽|주황 지붕과 청록 벽이 선명하다.|파스텔만 나타나는 필름이라는 해석의 반례.|[갤러리](https://thedarkroom.com/film/portra-400/photo-gallery/#gallery-2-3246606) · [이미지](https://thedarkroom.com/app/uploads/2019/07/Portra400-Xs-9833-25-1024x679.jpg)|\n|PORTRA400_03|TDR Lab Image|카페 인물|주황 옷은 강하고 피부는 갈색 계조로 보인다.|벽과 피부에 미세한 불규칙성이 보인다. 스캔 영향은 미확인.|[갤러리](https://thedarkroom.com/film/portra-400/photo-gallery/#gallery-2-3246605) · [이미지](https://thedarkroom.com/app/uploads/2019/07/Portra400-Xs-9833-17-679x1024.jpg)|\n|PORTRA400_04|TDR Lab Image|설경 인물|눈의 흰색과 숲의 짙은 녹색이 대비된다.|밝은 눈과 어두운 옷의 세부 보존이 다르다.|[갤러리](https://thedarkroom.com/film/portra-400/photo-gallery/#gallery-2-3246604) · [이미지](https://thedarkroom.com/app/uploads/2019/07/Portra400-RebelXs-000284880002-679x1024.jpg)|\n|PORTRA400_05|Davince|거리 스냅|붉은 벽과 모자, 강한 검은 그림자|따뜻하고 부드럽기만 한 명암은 아니다.|[갤러리](https://thedarkroom.com/film/portra-400/photo-gallery/#gallery-2-3416016) · [이미지](https://thedarkroom.com/app/uploads/film-index/portra-400/000042.JPG)|\n|PORTRA400_06|Alberto Medina|실내 조각|크림 벽과 청동 조각의 절제된 색|약한 얼룩과 면의 변화가 보인다.|[갤러리](https://thedarkroom.com/film/portra-400/photo-gallery/#gallery-2-3402513) · [이미지](https://thedarkroom.com/app/uploads/film-index/portra-400/70654999_1113349_8d68ad3cf675e952d6641d0f630f849c_full-large.jpeg)|\n|PORTRA400_07|Alberto Medina|야외 조각|회색 석재와 청록 창의 대비|태양광 아래 표면과 그림자의 차이가 선명하다.|[갤러리](https://thedarkroom.com/film/portra-400/photo-gallery/#gallery-2-3402512) · [이미지](https://thedarkroom.com/app/uploads/film-index/portra-400/70654992_1113349_409d00d4ac3ee88ce0bc283caa646640_full-large.jpeg)|\n|PORTRA400_08|Ezra Trost-Goldhammer|설산 풍경|청색 하늘·흰 산·갈색 풀|포맷은 캡션상 Pentax 645. 35mm 입자와 직접 비교하지 않는다.|[갤러리](https://thedarkroom.com/film/portra-400/photo-gallery/#gallery-2-3401934) · [이미지](https://thedarkroom.com/app/uploads/film-index/portra-400/patagoniaselects-9-large.jpg)|\n|PORTRA400_09|Ezra Trost-Goldhammer|해안 풍경|회청색 바다와 따뜻한 절벽|빛의 방향에 따라 같은 사진에 냉색과 난색이 함께 나타난다.|[갤러리](https://thedarkroom.com/film/portra-400/photo-gallery/#gallery-2-3401933) · [이미지](https://thedarkroom.com/app/uploads/film-index/portra-400/patagoniaselects-7-large.jpg)|\n|PORTRA400_10|Griffin Murphy|바위 해안|옅은 하늘과 짙은 전경 바위|그늘 부위는 어둡게 떨어진다. 모든 암부가 부드럽게 들리지는 않는다.|[갤러리](https://thedarkroom.com/film/portra-400/photo-gallery/#gallery-2-3394103) · [이미지](https://thedarkroom.com/app/uploads/film-index/portra-400/000042290008-large.jpg)|\n|PORTRA400_11|Griffin Murphy|세로 해안|청색 하늘과 짙은 녹색 전경|원경과 전경의 정보량이 다르다.|[갤러리](https://thedarkroom.com/film/portra-400/photo-gallery/#gallery-2-3394102) · [이미지](https://thedarkroom.com/app/uploads/film-index/portra-400/000042290014-large.jpg)|\n|PORTRA400_12|ester|나뭇가지|연두 잎·갈색 가지·점광원|역광과 잎 질감이 지배적이다. 필름만의 효과로 분리하기 어렵다.|[갤러리](https://thedarkroom.com/film/portra-400/photo-gallery/#gallery-2-3379611) · [이미지](https://thedarkroom.com/app/uploads/film-index/portra-400/IMG_20250501_173000113-large.jpg)|\n\n## Kodak EKTAR 100\n\n공식 근거: [Kodak EKTAR 100](https://www.kodak.com/en/still-film/product/professional/ektar-100-film/), 제품 소개 첫 문단\n\nISO 100 주광용 컬러 네거티브. 공식 설명은 고운 입자·선명도·선명한 색을 강조한다.\n\n관찰: 붉은 잎과 자동차는 선명하지만, 안개 빌딩과 흐린 소금 평원은 차분하다. 필름 이름이 피사체·광원과 무관한 전역 채도를 뜻하지 않는다.\n\n기존 AI F02의 문제: F02는 피부·목재·식물·책의 채도를 함께 올린 디지털 편집에 가깝다. 실제 샘플의 재질별 색 분리와 장면별 편차를 충분히 보여주지 못한다.\n\n수정 지시안(아직 새 필름 이미지를 생성하지 않음):\n\n> Keep fine unobtrusive texture and crisp edges where focused; separate red foliage, blue sky and neutral surfaces without increasing every color equally. Preserve scene lighting and plausible skin. No heavy grain, orange wash, HDR glow or invented light leaks. Educational interpretation only.\n\n|샘플|촬영자|장면|색·계조 관찰|질감·혼입 조건|출처|\n|---|---|---|---|---|---|\n|EKTAR100_01|TDR Lab Image|소금 평원|흰 지면과 옅은 하늘의 절제된 색|선명한 필름도 모든 장면이 고채도인 것은 아니다.|[갤러리](https://thedarkroom.com/film/ektar-100/photo-gallery/#gallery-2-3246396) · [이미지](https://thedarkroom.com/app/uploads/2019/06/ektar100-elan7-000123430011-1024x679.jpg)|\n|EKTAR100_02|TDR Lab Image|낙서 버스|초록·주황 버스와 회백색 하늘|채도 차이는 피사체 자체 색의 영향을 받는다.|[갤러리](https://thedarkroom.com/film/ektar-100/photo-gallery/#gallery-2-3246393) · [이미지](https://thedarkroom.com/app/uploads/2019/06/ektar100-elan7-000123430001-1024x679.jpg)|\n|EKTAR100_03|TDR Lab Image|붉은 잎|붉은색과 청록 배경이 강하게 분리된다.|잎맥과 흐린 배경을 구분한다. 굵은 입자 효과는 두드러지지 않는다.|[갤러리](https://thedarkroom.com/film/ektar-100/photo-gallery/#gallery-2-3246392) · [이미지](https://thedarkroom.com/app/uploads/2019/06/Ektar100-E7-23570025-1024x679.jpg)|\n|EKTAR100_04|TDR Lab Image|새와 전깃줄|짙은 청색 하늘과 따뜻한 구름|어두운 색에서도 미세한 계조가 남는다.|[갤러리](https://thedarkroom.com/film/ektar-100/photo-gallery/#gallery-2-3246391) · [이미지](https://thedarkroom.com/app/uploads/2019/06/Ektar100-E7-23570015-679x1024.jpg)|\n|EKTAR100_05|Nathan Ford|산길|청색 하늘과 어두운 산의 대비|잔디·산 표면과 하늘은 서로 다른 질감이다.|[갤러리](https://thedarkroom.com/film/ektar-100/photo-gallery/#gallery-2-3415874) · [이미지](https://thedarkroom.com/app/uploads/film-index/ektar-100/Colorado.JPG)|\n|EKTAR100_06|Scott J Hays|가을 계곡|황금색 잎·청색 물이 강하다.|캡션은 Pentax 67. 강한 처리 가능성을 배제할 수 없다. 워터마크 유지.|[갤러리](https://thedarkroom.com/film/ektar-100/photo-gallery/#gallery-2-3410171) · [이미지](https://thedarkroom.com/app/uploads/film-index/ektar-100/2025film035-finish-verticle-Cafe-large.jpg)|\n|EKTAR100_07|Mark|안개 낀 빌딩|회색·흑색 중심으로 매우 차분하다.|고채도만을 EKTAR의 정답으로 삼을 수 없는 반례.|[갤러리](https://thedarkroom.com/film/ektar-100/photo-gallery/#gallery-2-3389608) · [이미지](https://thedarkroom.com/app/uploads/film-index/ektar-100/Willis-in-mist-film-large.jpg)|\n|EKTAR100_08|Vick Thomas|산과 숲|녹색·갈색·보랏빛이 섞인 절제된 풍경|낮은 하늘 대비와 산 표면의 분리를 관찰한다.|[갤러리](https://thedarkroom.com/film/ektar-100/photo-gallery/#gallery-2-3379040) · [이미지](https://thedarkroom.com/app/uploads/film-index/ektar-100/20210804_Deception-Peak_347-0A-large.jpg)|\n|EKTAR100_09|Stacey Pearson|붉은 자동차|붉은 차체와 검은 유리의 강한 대비|광택 반사와 경계 선명도가 눈에 띈다.|[갤러리](https://thedarkroom.com/film/ektar-100/photo-gallery/#gallery-2-3375707) · [이미지](https://thedarkroom.com/app/uploads/film-index/ektar-100/IMG_0750-large.jpeg)|\n|EKTAR100_10|Andrew|사막 바위|청색 하늘과 적갈색 바위|짙은 그림자와 밝은 면이 함께 나타난다.|[갤러리](https://thedarkroom.com/film/ektar-100/photo-gallery/#gallery-2-3370299) · [이미지](https://thedarkroom.com/app/uploads/film-index/ektar-100/IMG_3216-large.jpeg)|\n|EKTAR100_11|Mark|도시 강변|푸른 창·회색 돌·짙은 그림자|재질별 반사와 암부 정보가 서로 다르다.|[갤러리](https://thedarkroom.com/film/ektar-100/photo-gallery/#gallery-2-3362660) · [이미지](https://thedarkroom.com/app/uploads/film-index/ektar-100/man-in-red-jacket-large.jpg)|\n|EKTAR100_12|Nadya|강변 반려견|옅은 하늘과 흰 개·벤치|장면 전체가 균일하게 선명하거나 선명한 색인 것은 아니다.|[갤러리](https://thedarkroom.com/film/ektar-100/photo-gallery/#gallery-2-3354368) · [이미지](https://thedarkroom.com/app/uploads/film-index/ektar-100/51309772-large.jpeg)|\n\n## Kodak TRI-X 400\n\n공식 근거: [Kodak TRI-X 400](https://www.kodak.com/en/still-film/product/professional/tri-x-400-film/), 제품 소개 첫 문단 / push processing 항목\n\nISO 400 흑백 네거티브. 공식 설명은 고전적인 입자 구조·경계 선명도와 증감 활용을 제시한다.\n\n관찰: 중간 계조와 짙은 검정이 함께 나타나며, 스튜디오·거리·역광 샘플의 질감이 다르다. 확산 필터 2장과 +1 표기 1장은 별도 조건으로 분리했다.\n\n기존 AI F03의 문제: F03은 피부와 배경 전체에 입자 같은 질감을 강하게 덧씌웠다. 실제 현상·포맷·스캔 차이를 설명하지 못하며, 균일한 노이즈가 TRI-X의 정답은 아니다.\n\n수정 지시안(아직 새 필름 이미지를 생성하지 않음):\n\n> Monochrome negative-scan interpretation, preserve distinct midtones and meaningful deep blacks. Fine irregular texture modulated by image tone, no uniform coarse noise over every surface. Keep skin, cloth, wood and background blur distinct. Do not imply a push process unless specified. Not calibrated emulation.\n\n|샘플|촬영자|장면|색·계조 관찰|질감·혼입 조건|출처|\n|---|---|---|---|---|---|\n|TRIX400_01|TDR Lab Image|카페 인물|피부·옷·타일의 중간 회색이 나뉜다.|벽·피부에 입자처럼 보이는 불규칙성이 있다. 암부는 짙다.|[갤러리](https://thedarkroom.com/film/tri-x-400/photo-gallery/#gallery-2-3307246) · [이미지](https://thedarkroom.com/app/uploads/2019/07/TX400-MP40mm-000246040019-Edit-796x1200.jpg)|\n|TRIX400_02|TDR Lab Image|자동차 정면|밝은 차체와 검은 배경의 강한 분리|차체 반사와 노면의 세부가 다르다.|[갤러리](https://thedarkroom.com/film/tri-x-400/photo-gallery/#gallery-2-3307244) · [이미지](https://thedarkroom.com/app/uploads/2019/07/TX400-Freedom-Zoom-000218380031ddd-1200x857.jpg)|\n|TRIX400_03|TDR Lab Image|고전 자동차|밝은 후드와 어두운 그릴의 대비|금속 경계와 흐린 나뭇잎을 구분한다.|[갤러리](https://thedarkroom.com/film/tri-x-400/photo-gallery/#gallery-2-3307243) · [이미지](https://thedarkroom.com/app/uploads/2019/07/TX400-F3-Filters-000436200007-Edit-1200x857.jpg)|\n|TRIX400_04|TDR Lab Image|어린이와 식물|흰 옷과 짙은 잎의 회색 차이|어린이의 피부·천·잔디가 서로 다른 질감이다.|[갤러리](https://thedarkroom.com/film/tri-x-400/photo-gallery/#gallery-2-3307241) · [이미지](https://thedarkroom.com/app/uploads/2019/07/TX400-at-200-1-F3-000323070014-Edit-796x1200.jpg)|\n|TRIX400_05|Andrew Karmun|철도|밝은 하늘과 짙은 울타리|하늘의 미세한 요철과 잔디의 구조를 입자 하나로 설명하지 않는다.|[갤러리](https://thedarkroom.com/film/tri-x-400/photo-gallery/#gallery-2-3419676) · [이미지](https://thedarkroom.com/app/uploads/film-index/tri-x-400/000170610008-large.jpg)|\n|TRIX400_06|Kelsa Sperl|호숫가 보트|넓은 밝은 수면과 검은 보트|잔물결과 잔디가 만드는 고주파 질감이 함께 존재한다.|[갤러리](https://thedarkroom.com/film/tri-x-400/photo-gallery/#gallery-2-3409170) · [이미지](https://thedarkroom.com/app/uploads/film-index/tri-x-400/IMG_3475-large.jpeg)|\n|TRIX400_07|Kelsa Sperl|숲속 인물|얼굴의 회색과 복잡한 나뭇잎|빛과 초점의 편차가 크다. 필름만의 효과로 일반화하지 않는다.|[갤러리](https://thedarkroom.com/film/tri-x-400/photo-gallery/#gallery-2-3409169) · [이미지](https://thedarkroom.com/app/uploads/film-index/tri-x-400/IMG_3448-large.jpeg)|\n|TRIX400_08|AFRO HiPPY|스튜디오 초상 1|어두운 배경과 부드러운 피부 계조|Mamiya RB67·Dream FX 확산 필터 명시. 부드러움을 필름 고유 성질로 분리하지 않는다.|[갤러리](https://thedarkroom.com/film/tri-x-400/photo-gallery/#gallery-2-3380291) · [이미지](https://thedarkroom.com/app/uploads/film-index/tri-x-400/43E6E5DB-695D-4433-8BF7-42B3EC0A4729_Original-large.jpg)|\n|TRIX400_09|AFRO HiPPY|스튜디오 초상 2|짙은 검정과 얼굴·가죽옷의 하이라이트|같은 촬영자의 확산 필터 조건. 피부 입자 단독 비교에서 분리한다.|[갤러리](https://thedarkroom.com/film/tri-x-400/photo-gallery/#gallery-2-3380290) · [이미지](https://thedarkroom.com/app/uploads/film-index/tri-x-400/48F24D5D-982B-49B6-B74A-4905DC06D5B4_Original-large.jpg)|\n|TRIX400_10|Hawk Buckman|거리 건축|흰 하늘과 어두운 벽·간판|캡션상 TRI-X +1. 구체 EI·현상 시간은 미확인.|[갤러리](https://thedarkroom.com/film/tri-x-400/photo-gallery/#gallery-2-3378617) · [이미지](https://thedarkroom.com/app/uploads/film-index/tri-x-400/2022-10-04-0026_01-large.jpg)|\n|TRIX400_11|Andrew|나무 구멍|중간 회색의 나무와 멀리 흐린 울타리|국부 선명도·초점과 입자 인상을 분리한다.|[갤러리](https://thedarkroom.com/film/tri-x-400/photo-gallery/#gallery-2-3377204) · [이미지](https://thedarkroom.com/app/uploads/film-index/tri-x-400/IMG_3755-large.jpeg)|\n|TRIX400_12|Nem|나뭇가지 인형|밝은 하늘과 짙은 인형·나뭇가지|뒷배경 흐림과 질감이 공존한다.|[갤러리](https://thedarkroom.com/film/tri-x-400/photo-gallery/#gallery-2-3375759) · [이미지](https://thedarkroom.com/app/uploads/film-index/tri-x-400/riolu_tree_high_f-large.png)|\n\n## 수업 자료 수정\n\n기존 F01~F03은 실제 필름의 대표 예시가 아니라 설명을 입력한 AI 초기 해석으로 재분류한다.\n실제 샘플 12장을 먼저 관찰하고, 그 범위와 AI의 과장을 비교한다.\n필름별 색상 정답 한 개를 지정하지 않는다. 공식 설명, 사진에서 본 관찰, AI 지시를 나눠 적는다.\n엑셀 원본은 변경하지 않았다. 외부 근거와 수업 해석을 별도 자료로 추가했다.\n", "source": "round4_수업비교_20261021/film_references_20261022/검토보고서.md"}, "9670c2cedd471bef": {"name": "수집목록.csv", "text": "﻿id,film,author,scene,source_page,image_url,local_file,source_caption,color_observation,texture_observation,license\nPORTRA400_01,Kodak PORTRA 400,TDR Lab Image,카페 외관,https://thedarkroom.com/film/portra-400/photo-gallery/,https://thedarkroom.com/app/uploads/2019/07/Portra400-Xs-9833-28-679x1024.jpg,docs/assets/PORTRA400_01.jpg,,민트 벽·갈색 목재·어두운 주차장,밝고 어두운 영역의 질감 차이. 그림자 정보가 제한된다.,저작권자 권리 유지. 재배포·공개수업 배포 허락 미확인. 로컬 검토용 수집.\nPORTRA400_02,Kodak PORTRA 400,TDR Lab Image,지붕과 벽,https://thedarkroom.com/film/portra-400/photo-gallery/,https://thedarkroom.c 립 검증 아님|\n|[TRIX400_11](https://thedarkroom.com/film/tri-x-400/photo-gallery/#gallery-2-3377204)|필름별 게시 사진·촬영자·캡션|gallery-2-3377204|나무 구멍|페이지·로컬 이미지 확인. 네거티브 독립 검증 아님|\n|[TRIX400_12](https://thedarkroom.com/film/tri-x-400/photo-gallery/#gallery-2-3375759)|필름별 게시 사진·촬영자·캡션|gallery-2-3375759|나뭇가지 인형|페이지·로컬 이미지 확인. 네거티브 독립 검증 아님|\n", "source": "round4_수업비교_20261021/film_references_20261022/실제필름_인용_명세서.md"}, "5cca7d1bb615df6d": {"name": "기능설명과수집검토.md", "text": "# PROVIA · CLASSIC CHROME · ACROS는 어디에서 온 말인가\n\n제조사: FUJIFILM Corporation, 후지필름. 세 이름은 카메라의 필름 시뮬레이션 기능명이다.\n조리개·화각·심도의 일반 광학 용어가 아니라 제조사가 정한 출력 모드의 고유명이다.\nPROVIA와 ACROS는 실물 필름 이름을 이어받았지만, 디지털 모드 결과와 그 필름 촬영은 같지 않다.\n상표를 만든 단어의 최초 어원은 이번에 확인한 공식 자료만으로 설명하지 않는다.\n\n공식 근거: [기능 FAQ](https://digitalcamera-support-en.fujifilm.com/digitalcameraengpcdetail?aid=000008291) · [카메라 매뉴얼](https://app.fujifilm-dsc.com/en/manual/x100f_v21/shooting/film_simulation/index.html)\n\n|기능명|이름의 출처|표현 방향|수업에서 활용|\n|---|---|---|---|\n|PROVIA|FUJICHROME PROVIA라는 후지필름의 컬러 리버설 필름 상표에서 이어진 이름이다. 여기서는 디지털 카메라의 PROVIA/STANDARD 모드를 뜻한다.|범용 표준 색 재현을 목표로 한다. 공식 설명에는 기억색과 맑은 색 표현이라는 의도가 있어, 무보정·무채색·색도계적 중립과 같지는 않다.|일상·인물·풍경의 기준 출력으로 시작해 다른 모드와 비교하기 좋다.|\n|CLASSIC CHROME|후지필름이 디지털 필름 시뮬레이션을 위해 만든 이름이다. 특정 실물 필름을 그대로 모델로 삼지 않았으며, 20세기 사진잡지의 보도사진 인상을 지향한다.|색을 절제하고 마젠타를 억제하며, 차가운 그림자를 사용하는 방향이다. 사진 전체에 갈색 필터를 씌우거나 무조건 어둡게 만드는 뜻은 아니다.|거리·다큐멘터리·생활 장면에서 색의 강도를 억제하고 형태와 상황을 읽게 하는 출발점으로 쓸 수 있다.|\n|ACROS|후지필름의 ACROS 흑백 필름 이름을 이어받은 디지털 흑백 모드다. 공식 자료는 필름 시뮬레이션 도입 시점을 2016년으로 설명한다.|짙은 검정과 부드러운 중간 회색, 선명도와 질감을 함께 설계한다. 공식 설명은 센서 노이즈를 활용해 밝기에 따른 입자 차이를 만든다고 밝힌다.|색의 역할을 덜고 빛·형태·재질·회색 계조를 비교할 때 적합하다. Ye/R/G 변형은 흑백 색 필터 효과이므로 기본 ACROS와 구분한다.|\n\n## 기능, 레시피, AI 지시의 구분\n\n- 기본 모드: 제조사가 만든 색·계조 처리 방식이다.\n- 레시피: 기본 모드에 WB·색·명암·입자 설정 등을 조합한 사용자 설정이다.\n- AI 지시: 기능의 설명을 이미지 생성 도구에 전달한 언어 지시다. 카메라 기능을 실행한 결과가 아니다.\n\n카메라별 지원 기능과 메뉴는 매뉴얼에서 확인한다.\n촬영 시 JPEG 출력과 RAW 변환을 구분해 기록한다.\n여기서 모은 공식 예시는 RAW 후변환 여부와 JPEG 직출 여부가 공개 자료에서 확인되지 않았다.\n따라서 “무보정 직출 원본”이라고 부르지 않는다.\n\n## 공식 사진 수집\n\nPROVIA 7장, CLASSIC CHROME 7장, ACROS 6장. 모두 후지필름 공식 페이지의 모드 적용 예시다.\n이 중 같은 세 장면을 세 모드로 처리한 비교 9장이 포함돼 있다.\n다른 장면 사이의 평균 색보다 이 9장의 같은 피사체 색·명암을 먼저 비교한다.\n색차의 실측과 기본 모드 설정의 완전한 통제는 확인하지 않았다.\n저작권은 촬영자와 권리자에게 있다. 공개 재배포 허락은 미확인이다.\n\n## 직접 관찰\n\n꽃 장면에서는 PROVIA와 CLASSIC CHROME의 분홍색·잎·하늘 변화를 함께 본다.\n얼굴과 석류 장면에서는 붉은 과일과 피부가 같은 정도로 변하는지 살핀다.\n보트 장면에서는 차양의 파란색과 그늘의 어두운 부분을 비교한다.\nACROS에서는 꽃과 잎의 밝기 분리, 피부의 중간 회색, 보트 그림자의 단계를 살펴본다.\nCLASSIC CHROME의 공식 예시에도 선명한 청록색 외벽이 있다. 절제된 색은 모든 색의 제거를 뜻하지 않는다.\n\n## AI 자료 수정\n\nS01~S03은 기능을 실행한 사진에서 “공식 설명을 입력한 AI 초기 해석”으로 명확히 구분한다.\n특히 S01을 무조건 중립적인 무보정 사진으로 설명하지 않는다.\nS03의 질감을 실제 ACROS 입자 알고리즘의 재현이라고 판단하지 않는다.\n\n## 출처와 수집 목록\n\n- [PROVIA 공식 설명](https://www.fujifilm-x.com/global/products/film-simulation/provia/)\n- [CLASSIC CHROME 공식 설명](https://www.fujifilm-x.com/global/products/film-simulation/classic-chrome/)\n- [ACROS 공식 설명](https://www.fujifilm-x.com/global/products/film-simulation/acros/)\n- PROVIA_01 · © Naoya Takahashi · 동일 장면 공식 비교 · [출처](https://www.fujifilm-x.com/global/products/film-simulation/) · [사진](https://fujifilm-x.b-cdn.net/wp-content/uploads/2024/04/xt50_naoya-takahashi_provia.jpg)\n- PROVIA_02 · © Lili Liu · 동일 장면 공식 비교 · [출처](https://www.fujifilm-x.com/global/products/film-simulation/) · [사진](https://fujifilm-x.b-cdn.net/wp-content/uploads/2024/04/xm5_lili-liu_provia-scaled.jpg)\n- PROVIA_03 · © Ana Markovych · 동일 장면 공식 비교 · [출처](https://www.fujifilm-x.com/global/products/film-simulation/) · [사진](https://fujifilm-x.b-cdn.net/wp-content/uploads/2024/04/xt50_ana-markovych_provia.jpg)\n- PROVIA_04 · © Caroline Tran · 공식 모드 소개 갤러리 · [출처](https://www.fujifilm-x.com/global/products/film-simulation/provia/) · [사진](https://fujifilm-x.b-cdn.net/wp-content/uploads/2024/05/Provia-by-Caroline-Tran-2.jpg)\n- PROVIA_05 · © Yukio Uchida · 공식 모드 소개 갤러리 · [출처](https://www.fujifilm-x.com/global/products/film-simulation/provia/) · [사진](https://fujifilm-x.b-cdn.net/wp-content/uploads/2025/11/2.ProviaYukio-Uchida-scaled-1-1.jp wp-content/uploads/2024/05/4.Classic-Chrome_©ZA_Nathalie-Boucry-2.jpg)\n- ACROS_01 · © Naoya Takahashi · 동일 장면 공식 비교 · [출처](https://www.fujifilm-x.com/global/products/film-simulation/) · [사진](https://fujifilm-x.b-cdn.net/wp-content/uploads/2024/04/xt50_naoya-takahashi_acros.jpg)\n- ACROS_02 · © Lili Liu · 동일 장면 공식 비교 · [출처](https://www.fujifilm-x.com/global/products/film-simulation/) · [사진](https://fujifilm-x.b-cdn.net/wp-content/uploads/2024/04/xm5_lili-liu_acros-scaled.jpg)\n- ACROS_03 · © Ana Markovych · 동일 장면 공식 비교 · [출처](https://www.fujifilm-x.com/global/products/film-simulation/) · [사진](https://fujifilm-x.b-cdn.net/wp-content/uploads/2024/04/xt50_ana-markovych_acros.jpg)\n- ACROS_04 · © Yukio Uchida · 공식 모드 소개 갤러리 · [출처](https://www.fujifilm-x.com/global/products/film-simulation/acros/) · [사진](https://fujifilm-x.b-cdn.net/wp-content/uploads/2024/05/1.Acros_©Yukio-Uchida-scaled.jpg)\n- ACROS_05 · © Joan Vendrell · 공식 모드 소개 갤러리 · [출처](https://www.fujifilm-x.com/global/products/film-simulation/acros/) · [사진](https://fujifilm-x.b-cdn.net/wp-content/uploads/2024/05/2.Acros_©Joan-Vendrell-1.jpg)\n- ACROS_06 · © Nicole Russo · 공식 모드 소개 갤러리 · [출처](https://www.fujifilm-x.com/global/products/film-simulation/acros/) · [사진](https://fujifilm-x.b-cdn.net/wp-content/uploads/2024/05/3.Acros_©Nicole-Russo.jpg)\n", "source": "round4_수업비교_20261021/fuji_simulation_references_20261022/기능설명과수집검토.md"}, "c928e44be7be9397": {"name": "시뮬레이션_인용_명세서.md", "text": "# 후지필름 시뮬레이션 인용 명세서\n\n|자료|근거|위치|적용|확인|\n|---|---|---|---|---|\n|[PROVIA](https://www.fujifilm-x.com/global/products/film-simulation/provia/)|FUJICHROME PROVIA라는 후지필름의 컬러 리버설 필름 상표에서 이어진 이름이다. 여기서는 디지털 카메라의 PROVIA/STANDARD 모드를 뜻한다. 범용 표준 색 재현을 목표로 한다. 공식 설명에는 기억색과 맑은 색 표현이라는 의도가 있어, 무보정·무채색·색도계적 중립과 같지는 않다.|본문 설명·작품 갤러리|09 보드 설명|직접 열람|\n|[CLASSIC CHROME](https://www.fujifilm-x.com/global/products/film-simulation/classic-chrome/)|후지필름이 디지털 필름 시뮬레이션을 위해 만든 이름이다. 특정 실물 필름을 그대로 모델로 삼지 않았으며, 20세기 사진잡지의 보도사진 인상을 지향한다. 색을 절제하고 마젠타를 억제하며, 차가운 그림자를 사용하는 방향이다. 사진 전체에 갈색 필터를 씌우거나 무조건 어둡게 만드는 뜻은 아니다.|본문 설명·작품 갤러리|09 보드 설명|직접 열람|\n|[ACROS](https://www.fujifilm-x.com/global/products/film-simulation/acros/)|후지필름의 ACROS 흑백 필름 이름을 이어받은 디지털 흑백 모드다. 공식 자료는 필름 시뮬레이션 도입 시점을 2016년으로 설명한다. 짙은 검정과 부드러운 중간 회색, 선명도와 질감을 함께 설계한다. 공식 설명은 센서 노이즈를 활용해 밝기에 따른 입자 차이를 만든다고 밝힌다.|본문 설명·작품 갤러리|09 보드 설명|직접 열람|\n|[FAQ](https://digitalcamera-support-en.fujifilm.com/digitalcameraengpcdetail?aid=000008291)|제조사 기능과 실물 필름의 관계|기능별 설명|용어 출처|직접 열람|\n|[매뉴얼](https://app.fujifilm-dsc.com/en/manual/x100f_v21/shooting/film_simulation/index.html)|기본 기능과 필터 변형|FILM SIMULATION|절차 안내|직접 열람|\n", "source": "round4_수업비교_20261021/fuji_simulation_references_20261022/시뮬레이션_인용_명세서.md"}, "b0c2aac377686d03": {"name": "comparison_30_images.html", "text": " 30장 시각문법 비교 검토 시각문법 A/B · 30장 직접 비교 기존 A 10장 + main/A 10장 + main/B 10장. 파일은 모두 서로 다른 생성 이미지입니다. 장면과 표현은 전반적으로 유사합니다. B의 실루엣·명암 강화는 일부 관찰되지만, 엑셀의 일관된 성능 개선은 입증되지 않았습니다. 조건을 아는 단일 검토자의 탐색적 판독입니다. T01 화사한 프로필 세 묶음 모두 밝은 배경·미소·앉은 자세. B의 뚜렷한 추가 이점은 보이지 않음. A 반복본 · 최상위 A 폴더 A · 시각문법 없음 B · 시각문법 있음 공통 지시와 B 추가문 피사체는 28세 성인 한국인 여성 모델 한 명이다. 짙은 갈색 어깨 길이 머리, 자연스러운 메이크업, 로고와 무늬가 없는 크림색 긴팔 셔츠와 차콜색 일자 바지를 입는다. 사실적인 사진 한 장을 만든다. 세로 4:5 비율을 사용한다. 글자, 로고, 워터마크, 콜라주는 넣지 않는다. 인물의 손과 신체 비례를 자연스럽게 표현한다. 밝은 크림색 스튜디오에서 의자에 앉아 어깨와 고개를 살짝 기울이고 부드럽게 미소 짓는 인물. 허리 위를 담는다. 얼굴의 그림자는 옅고 전체 분위기는 밝고 화사하다. 피부결과 밝은 부분의 디테일을 유지한다. 시각적 표현 지침: 밝은 톤과 최소한의 그림자. 확산된 빛으로 그림자 경계를 흐리게 하고 낮은 대비를 유지한다. T02 고전적인 배우 초상 모두 유사한 측면광 초상. B도 어두운 볼의 독립적인 작은 삼각광이 명확하지 않음. A와 B 모두 얼굴 중심보다 상반신 범위가 넓음. A 반복본 · 최상위 A 폴더 A · 시각문법 없음 B · 시각문법 있음 공통 지시와 B 추가문 피사체는 28세 성인 한국인 여성 모델 한 명이다. 짙은 갈색 어깨 길이 머리, 자연스러운 메이크업, 로고와 무늬가 없는 크림색 긴팔 셔츠와 차콜색 일자 바지를 입는다. 사실적인 사진 한 장을 만든다. 세로 4:5 비율을 사용한다. 글자, 로고, 워터마크, 콜라주는 넣지 않는다. 인물의 손과 신체 비례를 자연스럽게 표현한다. 어두운 회색 스튜디오의 진지하고 차분한 배우 초상. 얼굴 중심으로 촬영한다. 화면 왼쪽 위에서 오는 한 방향의 빛이 얼굴을 비추고, 어두운 쪽 볼에는 작은 삼각형 모양의 빛이 남는다. 눈을 카메라에 향한다. 시각적 표현 지침: 눈 밑 삼각형 하이라이트. 한쪽 얼굴에 빛이 닿고 반대편 뺨에는 작은 삼각형의 빛이 생기는 렘브란트 조명. T03 클래식 뷰티 광고 정면·중앙 배치가 모두 구현됨. B는 코 아래 유지한다. ", "source": "review_20261018/comparison_30_images.html"}, "c6b01dfb4b3947f5": {"name": "ABC_비교자료.html", "text": " ABC 시각문법 5과제 비교 VISUAL GRAMMAR / ROUND 2 / 15 IMAGES 짧은 의도에서 이미지를 설계하는 세 가지 방법 A 짧은 요청 · B 엑셀 기반 설계 · C 일반 지식 구체화 관찰: B는 빛·구도·포즈를 추적 가능한 계획으로 바꿨습니다. 결과에서는 B·C가 A보다 연출을 구체화했지만, B가 C보다 일관되게 우수하다는 증거는 아직 없습니다. 동일 세션에서 한 작성자가 구성한 빠른 파일럿입니다. 독립된 ‘지식 없음’ 조건이 아닙니다. 각 조건 1회, 조건을 아는 검토자 판독이며 모델 세부·시드는 미확인입니다. 이미지를 클릭하면 원본을 열 수 있습니다. 아래의 ‘실제 생성 프롬프트’를 펼치면 문장과 B의 근거를 확인할 수 있습니다. S01 화사하지만 입체적인 프로필 공통 요청: 화사하고 친근하지만 얼굴의 입체감이 살아 있는 프로필 사진. A · 짧은 요청 생활 공간의 미소 짓는 초상. 화사함과 입체감을 이미 표현한다. 실제 생성 프롬프트 · 116자 성인 한국인 여성 모델 한 명, 어깨 길이의 짙은 갈색 머리, 크림색 셔츠와 차콜색 바지. 세로 4:5 실사 사진 한 장. 글자·로고·콜라주 없음. 화사하고 친근하지만 얼굴의 입체감이 살아 있는 프로필 사진. B · 엑셀 기반 설계 회색 스튜디오, 기울인 고개, 약한 미소, 방향성 있는 부드러운 명암을 구현했다. 실제 생성 프롬프트 · 284자 성인 한국인 여성 모델 한 명, 어깨 길이의 짙은 갈색 머리, 크림색 셔츠와 차콜색 바지. 세로 4:5 실사 사진 한 장. 글자·로고·콜라주 없음. 화사하고 친근하지만 얼굴의 입체감이 살아 있는 프로필 사진. 밝은 회색 스튜디오에서 의자에 편안하게 앉은 상반신 사진. 넓은 소프트박스의 확산 측면광이 화면 왼쪽에서 비스듬히 들어온다. 반대편 볼에는 옅고 부드러운 그림자를 남겨 입체감을 유지한다. 고개를 조금 기울이고 입꼬리를 살짝 올린 치아 없는 미소. 눈과 피부결은 선명하고 밝은 피부 디테일은 유지한다. 엑셀 선택 근거 XLSX_03_0092 · 소프트 사이드라이트 — 방향성있는 확산광, 입체감 부여 XLSX_03_0094 · 소프트박스 메인광 — 부드러운 확산광, 균일한 톤, 피부결 부드럽게 XLSX_02_0385 · 약한 미소 — 볼 미세 상승, 눈가 잔주름 약함, 입꼬리 경미한 상승, 치아 비노출 편집 설계: 확산 측면광과 약한 미소를 연결. 무그림자 지시를 피하고 옅은 음영을 남김. C · 일반 지식 구체화 회색 스튜디오의 부드러운 프로필. B와 분위기·표정·구도가 매우 비슷하다. 실제 생성 프롬프트 · 279자 성인 한국인 여성 모델 한 명, 어깨 길이의 짙은 갈색 머리, 크림색 셔츠와 차콜색 바지. 세로 4:5 실사 사진 한 장. 글자·로고·콜라주 없음. 화사하고 친근하지만 얼굴의 입체감이 살아 있는 프로필 사진. 밝고 깨끗한 회색 스튜디오의 상반신 프로필. 모델은 의자에 편안히 앉아 고개를 조금 기울이고 자연스럽게 미소 짓는다. 큰 부드러운 조명으로 얼굴을 밝히되 코와 볼의 형태가 평평해지지 않게 은은한 음영을 남긴다. 따뜻하고 편안한 눈빛, 실제 피부결, 자연스러운 색감과 단정한 구도를 유지한다. 비교 판독 A보다 연출은 구체화됐으나, B가 C보다 낫다는 뚜렷한 차이는 없다. 공통 판정 기준: 밝고 친근한 인상 / 부드러운 빛과 피부 디테일 / 얼굴 입체감을 읽을 수 있는 음영 S02 조용한 카리스마 공통 요청: 과장된 표정 없이 조용한 카리스마가 느껴지는 배우 초상. A · 짧은 요청 일상 공간에서 턱을 괴고 응시하는 차분한 초상. 카리스마 해석은 주관적이다. 실제 생성 프롬프트 · 114자 성인 한국인 여성 모델 한 명, 어깨 길이의 짙은 갈색 머리, 크림색 셔츠와 차콜색 바지. 세로 4:5 실사 사진 한 장. 글자·로고·콜라주 없음. 과장된 표정 없이 조용한 카리스마가 느껴  실사 사진 한 장. 글자·로고·콜라주 없음. 얼굴을 드러내지 않고 익명성과 신비가 느껴지는 패션 사진. B · 엑셀 기반 설계 역광으로 얼굴 내부를 어둡게 하고 전신 외곽·굽힌 다리·오른쪽 여백을 구현. 의상 세부는 일부 남아 있다. 실제 생성 프롬프트 · 292자 성인 한국인 여성 모델 한 명, 어깨 길이의 짙은 갈색 머리, 크림색 셔츠와 차콜색 바지. 세로 4:5 실사 사진 한 장. 글자·로고·콜라주 없음. 얼굴을 드러내지 않고 익명성과 신비가 느껴지는 패션 사진. 밝은 직사각형 창을 뒤에 둔 실내 전신 사진. 강한 역광으로 얼굴과 의상 내부를 어둡게 남기는 실루엣 표현. 모델은 몸을 옆으로 돌리고 한쪽 다리의 힘을 빼 약간 굽힌다. 팔은 몸통에서 조금 떨어뜨려 윤곽을 읽을 수 있게 한다. 인물을 화면 왼쪽에 두고 오른쪽은 비운다. 얼굴을 밝히는 전면 조명은 사용하지 않는다. 엑셀 선택 근거 XLSX_03_0420 · 역광 및 실루엣 — 광원이 피사체 뒤에 위치하여 피사체의 윤곽선만 남기고 내부가 어둡게 처리됨. XLSX_02_0098 · 비대칭 구도 — 피사체를 한쪽으로 치우치게 배치하여 시각적 긴장감 유도 XLSX_04_0118 · 한쪽 다리를 굽힌 채 서 있는 — 다리 하나에 힘을 빼고 살짝 굽혀 편안하고 자연스러운 스탠스를 만듦 편집 설계: 역광·비대칭·다리 굽힘을 선택. 전면광 배제로 익명성과 외곽선 가독성을 함께 설계. C · 일반 지식 구체화 창을 보는 뒤·옆모습과 넓은 여백. 얼굴 정체성을 감추며 차분한 익명성을 구현한다. 실제 생성 프롬프트 · 294자 성인 한국인 여성 모델 한 명, 어깨 길이의 짙은 갈색 머리, 크림색 셔츠와 차콜색 바지. 세로 4:5 실사 사진 한 장. 글자·로고·콜라주 없음. 얼굴을 드러내지 않고 익명성과 신비가 느껴지는 패션 사진. 실내의 커다란 밝은 창 앞에 선 모델을 전신으로 담는다. 카메라에 얼굴이 드러나지 않도록 몸을 옆으로 돌리고 창 쪽을 바라본다. 뒤쪽에서 들어오는 빛으로 인물은 어둡고 배경은 밝게 표현한다. 팔다리의 모양과 의상 외곽은 자연스럽게 구분되게 한다. 한쪽에 인물을 두고 넓은 여백을 남겨 조용하고 신비로운 분위기를 만든다. 비교 판독 B는 실루엣 통제, C는 몸 방향 통제로 같은 의도를 달성. 미적·의도 적합성에서 B의 독점적 우위는 아니다. 공통 판정 기준: 얼굴 정체성이 노출되지 않음 / 전신 외곽과 자세를 읽을 수 있음 / 여백과 명암의 신비로운 분위기 첫 성공본 15장 보존 · 실제 프롬프트 및 근거 ID 기록 · 이미지 내장형 HTML ", "source": "round2_ABC_5cases/ABC_비교자료.html"}, "037e8d63cabc0959": {"name": "실험적조합_결과.html", "text": " 시각문법 실험적 조합 5종 ROUND 3 / CREATIVE COMBINATIONS 익숙한 문법을 낯선 관계로 결합하기 5종의 첫 성공본. 효과의 인과 검증이 아닌 창작 가능성 탐색입니다. 전체 실험 기록 E01 빛이 만든 두 인격 한 얼굴에 서로 다른 조명 성질을 나누어 적용한다. 부분 구현 얼굴 왼쪽의 청록빛과 오른쪽의 주황빛 윤곽, 검은 여백을 구현했다. 얼굴의 명암 분리는 완전한 반분보다 완만하다. 두 인격이라는 정서 해석은 검증되지 않았다. 색광의 역할 분리는 유효한 창작 관찰. 스플릿의 정확한 형태는 추가 실험 필요. 실제 프롬프트와 코퍼스 근거 세로 4:5의 독립적인 실험적 에디토리얼 이미지 한 장. 성인 한국인 여성 한 명, 어깨 길이 짙은 갈색 머리, 단순한 크림색 셔츠와 차콜색 바지. 얼굴과 신체는 자연스럽게 표현한다. 글자·로고·워터마크·여러 패널 없음. 검은 스튜디오의 얼굴과 어깨 초상. 얼굴은 화면 오른쪽에 두고 왼쪽에 넓은 검은 여백. 정면을 차분히 응시한다. 화면 왼쪽 측면의 좁고 단단한 청록빛이 얼굴 왼쪽 절반을 밝히고, 오른쪽 절반은 어둡게 남긴다. 오른쪽 머리카락과 어깨 바깥선에만 아주 얇은 붉은 주황빛을 두른다. 두 눈·입은 각각 정상적인 하나의 얼굴이다. 복제 얼굴이나 반으로 나눈 피부가 아니라 빛과 그림자가 만드는 이중적인 인상. 피부결은 실제 사진처럼 유지한다. XLSX_03_0101 스플릿 조명 — 반 얼굴 명암 대비, 강한 콘트라스트, 극적인 인상 XLSX_01_0334 보색의 강렬한 대비 — 초록과 빨강, 파랑과 주황 등 보색 관계의 색들을 나란히 배치하여 시각적 긴장감을 극대화합니다. XLSX_02_0098 비대칭 구도 — 피사체를 한쪽으로 치우치게 배치하여 시각적 긴장감 유도 영역별 배치·신체 변형·공간 설정은 작성자의 창작 확장이다. E02 도시 속에 멈춘 사람 인물의 정지와 주변의 시간 흐름을 대비한다. 핵심 구현 중앙 인물의 정지·선명도와 주변 행인·차량의 흐름이 함께 보인다. 일부 주변 신체는 길게 늘어나거나 흐릿하다. 실제 촬영 가능한 노출·합성 공정까지 검증한 것은 아니다. 시간 대비가 잘 읽힌다. 장노출의 상세 공정은 엑셀 정의가 아닌 작성자 확장. 실제 프롬프트와 코퍼스 근거 세로 4:5의 독립적인 실험적 에디토리얼 이미지 한 장. 성인 한국인 여성 한 명, 어깨 길이 짙은 갈색 머리, 단순한 크림색 셔츠와 차콜색 바지. 얼굴과 신체는 자연스럽게 표현한다. 글자·로고·워터마크·여러 패널 없음. 밤의 넓은 횡단보도 한가운데 모델이 양발을 붙이고 완전히 멈춰 서서 카메라를 응시하는 전신 사진. 모델은 중앙에 선명하고 얼굴과 손가락과 옷은 흔들리지 않는다. 주변의 행인들은 반투명한 움직임의 흔적으로 흐르고 차량 불빛은 가로 방향의 긴 궤적으로 지나간다. 발과 바닥의 접지는 분명하다. 어두운 도시 배경과 한 사람의 또렷한 고요함. 실사 장노출 사진의 시각적 표현이며 별도의 복제 인물이나 만화 속 속도선은 사용하지 않는다. XLSX_08_0038 선명도/흐림 대비 — 초점이 맞은 영역과 흐릿한 영역을 극적으로 대비시켜 특정 요소에 시선을 집중시킴. XLSX_02_0096 중앙 집중 구도 — 피사체를 화면의 정중앙에 배치 영역별 배치·신체 변형·공간 설정은 작성자의 창작 확장이다. E03 종이로 만들어진 피부 실사 피부의 일부를 종이 층으로 바꾸되 인물 정체를 유지한다. 핵심 구현 피부와 종이의 섬유 결·찢어진 가장자리·작은 층 그림자가 함께 표현됐다. 신체가 종이로 이루어졌다기보다 표면에 조각을 붙인 인상이 강하다. 종이 영역이 목·의상으로 넓게 확장됐다. 재질 혼합의 탐색 사례. 종이로 변하는 구조와 종이 장식의 차이를 다음에 분리할 필요. 실제 프롬프트와 코퍼스 근거 세로 4:5의 독립적인 실험적 에디토리얼 이미지 한 장. 성인 한국인 여성 한 명, 어깨 길이 짙은 갈색 머리, 단순한 크림색 셔츠와 차콜색 바지. 얼굴과 신체는 자연스럽게 표현한다. 글자·로고·워터마크·여러 패널 없음. 밝은 회색 스튜디오의 얼굴 중심 3/4 초상. 얼굴의 왼쪽 눈과 코와 입은 실제 피부로 남기고, 오른쪽 관자놀이에서 볼의 바깥선과 어깨로 이어지는 한정된 부분만 크림색·황토색·차콜색 종이 조각의 얇은 층으로 표현한다. 종이의 찢어진 가장자리와 섬유 결, 층 사이 작은 그림자가 정교하게 보인다. 피부에서 종이로 자연스럽게 전환되는 수공예 패션 아트. 몸을 벗기거나 상처를 드러내는 장면이 아니라 깨끗하고 비폭력적인 종이 콜라주 조형물이다. 눈·입의 수와 얼굴 윤곽은 자연스럽게 유지한다. XLSX_01_0622 종이 질감 — 종이 느낌, 섬세한 결 또는 얼룩 포함 XLSX_01_1233 콜라주 기법 — 인쇄물, 천 조각 등 다양한 재료를 오려 붙여 새로운 의미와 질감을 창조합니다. 영역별 배치·신체 변형·공간 설정은 작성자의 창작 확장이다. E04 거대한 그림자와 작은 사람 그림자와 인물의 크기 관계를 과장한다. 부분 구현 작은 사람과 화면을 압도하는 거대한 벽 그림자, 어두운 공간을 구현했다. 인물은 요청한 화면 높이의 1/10보다 커 보인다. 작은 광원이 명확히 드러나지 않고, 그림자 투사의 물리 정합성은 미검증이다. 크기 대비는 뚜렷하다. 조명 위치·그림자 대응은 별도 검증 문제로 남긴다. 실제 프롬프트와 코퍼스 근거 세로 4:5의 독립적인 실험적 에디토리얼 이미지 한 장. 성인 한국인 여성 한 명, 어깨 길이 짙은 갈색 머리, 단순한 크림색 셔츠와 차콜색 바지. 얼굴과 신체는 자연스럽게 표현한다. 글자·로고·워터마크·여러 패널 없음. 거대한 비어 있는 콘크리트 홀을 멀리서 바라본 익스트림 롱 샷. 모델은 화면 하단 왼쪽에 전체 높이의 약 1/10 크기로 서 있다. 모델 앞 낮은 위치의 작은 집중 광원에서 나온 빛 때문에 뒤쪽 거대한 벽에 같은 자세의 그림자가 천장 가까이 길게 솟는다. 그림자는 모델보다 여러 배 크고 화면을 지배한다. 인물과 그림자가 각각 하나이며 그림자의 머리와 팔 방향은 모델과 대응한다. 어두운 로우키 공간, 회색과 검정의 절제된 명암, 작은 사람과 거대한 그림자의 불균형. 괴물이나 별도의 거인이 아니라 사람의 투사 그림자이다. XLSX_02_0043 익스트림 롱 샷 — 피사체가 화면에서 아주 작게 보이며, 배경이 압도적인 샷. XLSX_03_0071 로우키 조명 — 어두운 배경, 낮은 노출, 집중된 빛 영역별 배치·신체 변형·공간 설정은 작성자의 창작 확장이다. E05 밤의 색으로 비추는 낮 낮의 환경광과 인물의 인공 색광을 분리한다. 핵심 구현 하늘·잔디는 밝은 낮의 색을 유지하고 얼굴과 셔츠에 청록·자홍색이 국소적으로 닿는다. 색광은 인공적이고 강하게 보인다. 실제 낮 환경에서 가능한 광량을 검증한 결과는 아니다. 배경과 피사체의 색광 적용 범위를 구분하는 실험이 잘 읽힌다. 실제 프롬프트와 코퍼스 근거 세로 4:5의 독립적인 실험적 에디토리얼 이미지 한 장. 성인 한국인 여성 한 명, 어깨 길이 짙은 갈색 머리, 단순한 크림색 셔츠와 차콜색 바지. 얼굴과 신체는 자연스럽게 표현한다. 글자·로고·워터마크·여러 패널 없음. 밝은 한낮의 녹색 공원에서 모델의 허리 위를 담는다. 푸른 하늘과 초록 나무와 잔디는 자연스러운 낮의 색과 밝기를 유지한다. 모델의 얼굴과 셔츠에만 왼쪽 청록색, 오른쪽 자홍색의 명확한 컬러젤 조명이 닿아 밤거리의 색을 띤다. 넓고 부드러운 측면광, 실제 피부결, 옅은 그림자. 배경을 밤이나 네온 도시로 바꾸지 않는다. 전 화면 색 필터가 아니라 피사체에 국한된 인공 색광이다. 조명 장비 자체는 프레임 밖에 두고 주인공을 자연스럽게 중앙에 배치한다. XLSX_03_0174 네온사인 / 컬러젤 라이트 — 특정 색의 인공 조명 / 감정적 색채 강조 XLSX_03_0092 소프트 사이드라이트 — 방향성있는 확산광, 입체감 부여 영역별 배치·신체 변형·공간 설정은 작성자의 창작 확장이다. ", "source": "round3_실험적조합/실험적조합_결과.html"}, "38a36f61f6e878c2": {"name": "실험전체_기록.md", "text": "# 시각문법 이미지 실험 전체 기록\n\n기록일: 2026-10-18. 프로젝트 내 원본 51장: 시연 1장 + 1차 30장 + 2차 15장 + 3차 5장.\n전체 파일 목록·해시는 실험전체_파일명세.json에 기록했다. 비교 HTML·JPG에 포함한 복제 표현은 원본 장수에 더하지 않았다.\n\n|회차|질문|실행|결과와 한계|\n|---|---|---|---|\n|기본 샷|조합으로 전형적인 사진을 만들 수 있는가?|1장|구현 시연. 대조군 없음|\n|1차 A/B|상세 지시에서 코퍼스 설명을 추가하면 좋아지는가?|A 10장·B 10장·별도 A 10장|장면이 유사. A 원문에 이미 시각문법이 상세하게 들어감. B의 일관된 우위 입증 못함|\n|2차 ABC|짧은 의도를 코퍼스와 일반 지식으로 구체화하면 다른가?|5과제×3조건=15장|B/C는 연출을 구체화. 같은 세션·같은 작성자로 독립 무코퍼스 대조군 아님|\n|3차 조합|다른 영역을 묶으면 낯선 표현을 설계할 수 있는가?|5종×1장=5장|종이 재질·정지/움직임·낮/네온 등 구현. 창작 가능성 시연이며 엑셀 고유 효과는 미검증|\n\n## 자료 위치\n\n- 1차 30장 비교: review_20261018/comparison_30_images.html\n- 1차 검토: review_20261018/검토보고서.md\n- 2차 15장 비교: round2_ABC_5cases/ABC_비교자료.html\n- 2차 프롬프트: round2_ABC_5cases/prompts.json\n- 2차 검토: round2_ABC_5cases/ABC_비교보고서.md\n- 3차 결과: round3_실험적조합/실험적조합_결과.html\n- 3차 프롬프트·메타데이터: round3_실험적조합/prompts.json 및 E01~E05.json\n- 전체 미리보기: 실험전체_기록.html\n\n## 현재까지 확인한 것\n\n1. 엑셀 항목을 고르고 광원·포즈·구도·재질에 적용한 근거를 추적할 수 있다.\n2. 상세한 지시는 코퍼스 없이도 전형적인 사진을 잘 만들었다.\n3. 낯선 조합은 제작 가능하지만 이미지의 외형 차이만으로 코퍼스의 고유 기여를 입증하지 못한다.\n4. 정교한 요청이 항상 구현되지 않는다. 배우 초상의 삼각광과 그림자 물리 정합성은 해결되지 않았다.\n\n## 확인하지 못한 것\n\n- 실제 이미지 모델·버전·품질·시드 일치. 같은 도구·해상도만으로 모델 동일성을 보장할 수 없다.\n- 학생의 이해·선택 능력·제작 시간 향상. 교육적 효용은 가설이다.\n- 같은 조건에서의 반복 재현성·독립 평가자 선호·정량적인 품질 향상.\n- 독립된 무코퍼스 세션 효과. 2·3차는 같은 대화 맥락의 영향을 배제하지 못한다.\n\n## 판단의 대안\n\n일반 모델 지식만으로 충분할 수 있다. 반대로 시험이 코퍼스의 장점을 드러내지 못했을 수도 있다.\n창작자의 문장 설계, 추가 길이, 생성 우연성이 차이를 설명할 수도 있다. 결과를 한 방향으로 확정하지 않는다.\n다음에는 한 사례의 단계별 변형과 독립 세션 반복을 수행한다. 교육적 효과는 학생의 예측·설명·수정 과정으로 별도 평가한다.\n\n## 기록 원칙\n\n첫 성공본을 보존했다. 미적 실패를 삭제하거나 재생성해 유리한 사례를 고르지 않았다.\n원본 자료는 수정하지 않았다. 엑셀 정의와 작성자의 창작 확장을 구분했다.\n이미지는 생성 이미지이며 실제 인물의 촬영 기록이 아니다. 외부 이미지 참조 파일은 전달하지 않았다.\n\n## 4차 수업 비교 — 2026-10-22\n\nAI 선정본 28장과 보완 전 후보 1장을 추가했다. 누적 선정본은 79장이다. 이전 51장 기록은 당시 결과로 보존한다.\n\n- 전체 포스터: [수업 비교 자료](round4_수업비교_20261021/수업용_다이어그램_비교포스터.html)\n- 원문 대응표: round4_수업비교_20261021/01_엑셀원문과이미지_대응표.md\n- 실제 촬영본 미확보. 카메라·필름 AI 해석을 실제 성능으로 해석하지 않는다.\n\n### 수업 공간 도식 추가\n\n2026-10-22: 도식 3종 선정, 보완 후보 1종 보존. 장면 이미지 실험 수에는 포함하지 않는다. 해설 9개 보드와 이미지 간격 개선을 기존 수업 HTML에 반영했다.\n\n## 실제 촬영 레퍼런스와 교정\n\n필름 레퍼런스 36장과 공식 디지털 모드 적용 예시 20장을 수집했다. AI 실험 선정본 장수에 합산하지 않는다.\n08 보드에 8종 라벨 안내판과 36장을, 09 보드에 공식 20장을 직접 배치했다.\nG04·M02를 갱신했고 이전 선정본과 미선정안은 보존했다. 누적 선정본 수는 유지하되 해시를 새 파일로 갱신했다.\n\n## 언어·실제 사례 반영 비교\n\n2026-10-22: 11쌍 22장 추가. 모델 가중치 학습이 아니라 입력 조건 비교다. 실제 사례 분석과 사진 참조를 함께 추가한 효과는 분리하지 못한다.\n[비교 페이지](round4_수업비교_20261021/language_vs_reference_20261022/언어반영_사례반영_11쌍비교.html)\n\n", "source": "실험전체_기록.md"}, "e131ff6bf73b997a": {"name": "사진질감_엑셀검토.md", "text": "# 사진 질감: 엑셀 원문 검토\n\n검토일: 2026-10-22. 최초 한영병기 마스터와 최종수정본의 구조를 확인했다. 아래 행은 최종수정본 기준이다.\n원본과 최종수정본 엑셀은 수정하지 않았다. 이 문서는 새 수업 자료를 위한 검토 기록이다.\n\n## 확인 결과\n\n사진 질감은 필름·노이즈, 선명도·흐림, 빛 번짐, 피사체 표면, 조명으로 나눠 활용할 수 있다.\n원문에는 사진·회화·헤어·인쇄 질감이 섞여 있다. 단순한 ‘질감’ 검색 결과를 사진 개념 수로 계산하지 않는다.\n원문의 ‘사용 가능’은 편집 상태다. 사실 검증이나 이미지 생성 효과가 입증되었다는 의미는 아니다.\n\n| 수업 분류 제안 | 실제 수록 내용 | 최종마스터 행 |\n|---|---|---|\n| 입자와 노이즈 | 디지털 노이즈, Film Grain, Heavy·Medium·Fine | 2, 648, 738–741, 1266, 2526 |\n| 전체 사진 인상 | Filmic Texture, Grainy Texture, gritty photorealism | 16, 32, 77 |\n| 선명도와 흐림 | 고해상도 디테일, 헤이즈/소프트포커스, 주변 흐림, Sharpness/Blur Contrast | 102, 752, 4484, 5010 |\n| 빛 번짐과 확산 | bloom/glow, Soft Filter, 블랙 프로미스트 1/4, 시네블룸 10% | 2633, 5005, 5012, 5013 |\n| 피사체 표면 | 목재 결, 금속 반사, 종이 결, 클로즈업 예시의 모공과 미세 주름 | 151, 170, 622, 1841 |\n| 질감을 드러내는 조명 | Beauty Dish, Softbox, Hard Light, 하이라이트 제어, 직광 플래시 | 2354, 2428, 2432, 2458, 3684 |\n\n이 분류는 이번 검토의 제안이다. 엑셀에 이미 존재하는 단일 분류표를 복사한 것이 아니다.\n\n## 보완할 부분\n\n- Fine Grain 741행은 ‘사전표제_분리불가’로 보류되어 있다. Heavy·Medium과 동등한 확정 항목으로 표시하지 않는다.\n- 블랙 프로미스트와 시네블룸은 ‘원본행_미연결’로 보류되어 있다. 외부 근거 확인 없이 필터 성능을 확정하지 않는다.\n- 모공은 독립 표제어가 아니라 클로즈업의 국문 예시에 한 번 등장한다.\n- ‘할레이션/halation’, ‘microcontrast/micro-contrast’는 표제·설명·국문 예시·영문 예시에서 문자열 일치를 찾지 못했다.\n- 그레인 크기·강도·분포, 노이즈의 위치와 색, 피부 보정 정도를 정량적으로 조절하는 기준은 이번 검토로 확보하지 못했다.\n- 필름 질감 32행은 따뜻한 그림자와 그레인, 대비를 함께 묶는다. 입자 효과만의 비교 기준으로 바로 쓰기 어렵다.\n- 브룸 효과 2633행은 bloom/glow와 렌즈 플레어를 함께 설명한다. 수업에서 각각의 현상을 구분하려면 추가 근거가 필요하다.\n\n## 수업 비교 구성 제안\n\n1. 인물과 조명, 구도, 색감을 고정한다.\n2. 입자 없음·미세 입자·강한 입자·디지털 노이즈의 네 조건을 비교한다.\n3. 별도 비교에서는 조명만 바꾸고 피부·목재·천의 결을 관찰한다.\n4. 전체 화면과 같은 부위의 확대 이미지를 함께 제시한다.\n5. 각 이미지에 엑셀 항목과 새로 보충한 지시를 구분해 적는다.\n\n위 내용은 다음 제작을 위한 제안이다. 아직 새 이미지를 생성하거나 효과를 검증하지 않았다.\n\n## 원문 발췌\n\n설명과 사용 상태를 그대로 기록했다. 감정 효과와 장비 성능에 관한 문장은 원문의 주장으로 읽는다.\n\n### 디지털 노이즈 — 2행\n\n- 영어: digital noise\n- 상태: 사용 가능\n- 원문 설명: 디지털 이미지에서 입자나 불규칙한 신호처럼 보이는 노이즈 표현.\n- 이전 위치: 01_화풍 & 재질·기법 / 2행\n\n### 거친 사진적 사실주의 — 16행\n\n- 영어: gritty photorealism\n- 상태: 사용 가능\n- 원문 설명: 거친 질감과 사진처럼 보이는 묘사를 함께 지정하는 표현.\n- 이전 위치: 01_화풍 & 재질·기법 / 16행\n\n### 필름 질감 — 32행\n\n- 영어: Filmic Texture\n- 상태: 사용 가능\n- 원문 설명: 따뜻한 그림자, 부드러운 그레인, 클래식한 콘트라스트\n- 이전 위치: 01_화풍 & 재질·기법 / 32행\n\n### 거친 필름 질감 — 77행\n\n- 영어: Grainy Texture\n- 상태: 사용 가능\n- 원문 설명: 거친 그레인·빈티지\n- 이전 위치: 01_화풍 & 재질·기법 / 77행\n\n### 고해상도 디테일 — 102행\n\n- 영어: 미기재\n- 상태: 사용 가능\n- 원문 설명: 질감의 미세한 디테일 강조. 사실감 강화\n- 이전 위치: 01_화풍 & 재질·기법 / 102행\n\n### 금속 재질 — 151행\n\n- 영어: 미기재\n- 상태: 사용 가능\n- 원문 설명: 금속성 반사광, 광택 재질\n- 이전 위치: 01_화풍 & 재질·기법 / 151행\n\n### 나무결 / 목재 질감 — 170행\n\n- 영어: 미기재\n- 상태: 사용 가능\n- 원문 설명: 나뭇결, 목재 특유의 무늬 표현\n- 이전 위치: 01_화풍 & 재질·기법 / 170행\n\n### 아트필터 — 485행\n\n- 영어: Grainy Film\n- 상태: 사용 가능\n- 원문 설명: 올림푸스 그레이니 필름 아트 필터로 재현된 거친 필름 입자와 깊은 검은색의 느와르 스타일 흑백 거리 스냅\n- 이전 위치: 01_화풍 & 재질·기법 / 485행\n\n### 종이 질감 — 622행\n\n- 영어: 미기재\n- 상태: 사용 가능\n- 원문 설명: 종이 느낌, 섬세한 결 또는 얼룩 포함\n- 이전 위치: 01_화풍 & 재질·기법 / 622행\n\n### 필름 그레인 — 648행\n\n- 영어: Film Grain\n- 상태: 사용 가능\n- 원문 설명: 필름 특유의 입자감을 더해 아날로그적, 거친 질감 연출.\n- 이전 위치: 01_화풍 & 재질·기법 / 648행\n\n### 필름 그레인 — 738행\n\n- 영어: Film Grain\n- 상태: 사용 가능\n- 원문 설명: 필름 사진 특유의 미세한 입자감. 이미지에 질감을 더해 아날로그적이고 거친 느낌을 주며, 디지털 이미지의 매끈함을 덜어냅니다.\n- 이전 위치: 01_화풍 & 재질·기법 / 738행\n\n### 필름 그레인 — 739행\n\n- 영어: film grain / grain\n- 상태: 사용 가능\n- 원문 설명: 아날로그 필름 사진 특유의 입자감. 빈티지·시네마틱 분위기 연출에 적합\n- 이전 위치: 01_화풍 & 재질·기법 / 739행\n\n### Film Grain – Heavy 거칠고 빈티지한 필름 질감 — 740행\n\n- 영어: 미기재\n- 상태: 사용 가능\n- 원문 설명: Film Grain – Heavy\n- 이전 위치: 01_화풍 & 재질·기법 / 740행\n\n### Film Grain – Fine 섬세한 입자감, 은은한 필름 질감 — 741행\n\n- 영어: 미기재\n- 상태: 보류\n- 원문 설명: Film Grain – Fine\n- 이전 위치: 01_화풍 & 재질·기법 / 741행\n- 보류 사유: 사전표제_분리불가\n\n### 헤이즈 / 흐림 — 752행\n\n- 영어: haze / soft focus\n- 상태: 사용 가능\n- 원문 설명: 필름 사진이나 오래된 렌즈에서 나는 부드러운 흐림 효과\n- 이전 위치: 01_화풍 & 재질·기법 / 752행\n\n### Film Grain – Medium 보통 정도의 필름 질감 — 1266행\n\n- 영어: 미기재\n- 상태: 사용 가능\n- 원문 설명: Film Grain – Medium\n- 이전 위치: 01_화풍 & 재질·기법 / 1266행\n\n### 클로즈업 샷 — 1841행\n\n- 영어: Close-Up Shot\n- 상태: 사용 가능\n- 원문 설명: 피사체의 얼굴이나 특정 부분을 화면 가득 채우는 샷.\n- 이전 위치: 02_구도 & 시각문법 / 545행\n- 국문 예시: 인물의 나이, 특징, 그리고 가장 중요한 감정 상태를 구체적으로 묘사, 얼굴이나 피사체의 가장 중요한 세부 사항을 강조하여 현실감을 높입니다. ex)20대 여성, 햇볕에 그을린 얼굴, 고뇌하는 표정, 눈물을 참는 눈빛, 희미한 미소, 촉촉한 입술, 땀이 맺힌 이 마, 머리카락 한 가닥, 눈 주변의 미세한 주름, 피부의 모공\n\n### 뷰티디쉬 조명 — 2354행\n\n- 영어: Beauty Dish Lighting\n- 상태: 사용 가능\n- 원문 설명: 중심집중광, 부드러운 하이라이트, 피부결 강조\n- 이전 위치: 03_조명 & 시간 & 색채 / 20행\n\n### 소프트박스 메인광 — 2428행\n\n- 영어: Softbox Key Light\n- 상태: 사용 가능\n- 원문 설명: 부드러운 확산광, 균일한 톤, 피부결 부드럽게\n- 이전 위치: 03_조명 & 시간 & 색채 / 94행\n\n### 스페큘러 하이라이트 제어 — 2432행\n\n- 영어: Specular Highlight Control\n- 상태: 사용 가능\n- 원문 설명: 광택 조절, 피부광 반사, 윤기 표현\n- 이전 위치: 03_조명 & 시간 & 색채 / 98행\n\n### 하드 라이트 — 2458행\n\n- 영어: Hard Light\n- 상태: 사용 가능\n- 원문 설명: 강한 스포트라이트나 작은 광원을 이용해 피사체에 직접적으로 빛을 비춤. 그림자가 선명하고 피부 질감, 근육선, 윤곽이 뚜렷하게 드러남. 감정적으로는 강렬함·긴장감·섹슈얼한 인상을 줌.\n- 이전 위치: 03_조명 & 시간 & 색채 / 124행\n\n### 디지털 노이즈 — 2526행\n\n- 영어: digital noise / noise\n- 상태: 사용 가능\n- 원문 설명: 디지털 카메라의 거친 질감, 불완전하고 리얼한 느낌\n- 이전 위치: 03_조명 & 시간 & 색채 / 192행\n\n### 버터플라이 조명 / Paramount Light — 2632행\n\n- 영어: Butterfly Light\n- 상태: 사용 가능\n- 원문 설명: 카메라 정면에서 약간 위쪽(얼굴 위 30~45도)에 놓은 조명으로, 코 밑에 나비 모양의 그림자가 생김. 얼굴 윤곽이 강조되고 입술과 눈 주위에 드라마틱한 하이라이트를 형성. 뷰티·패션 사진에서 피부결을 부드럽게 표현하면서도 선명한 인상을 줌.\n- 이전 위치: 03_조명 & 시간 & 색채 / 298행\n\n### 브룸 효과 — 2633행\n\n- 영어: bloom / glow\n- 상태: 사용 가능\n- 원문 설명: 빛 번짐, 렌즈 플레어 등 밝은 영역의 발광 표현\n- 이전 위치: 03_조명 & 시간 & 색채 / 299행\n\n### 뷰티 리플렉터 필라이트 — 3344행\n\n- 영어: Beauty Reflector Fill\n- 상태: 사용 가능\n- 원문 설명: 인물 아래쪽 혹은 카메라 근처에 반사판을 두어 하단 그림자를 없애고 얼굴과 다리 하단부를 밝게 유지. 피부결이 고르게 보이게 함.\n- 이전 위치: 04_인물 & 포즈 & 스타일 / 169행\n\n### 직광 플래시 / 온카메라 플래시 — 3684행\n\n- 영어: On-Camera Flash\n- 상태: 사용 가능\n- 원문 설명: 카메라 바로 위나 근처에서 플래시를 직접 터뜨려 인물 전체를 강하게 비춤. 눈동자에 작은 하이라이트가 생기며, 피부와 헤어의 질감이 강조됨. 배경은 어두워지고 인물이 튀어나오는 효과.\n- 이전 위치: 04_인물 & 포즈 & 스타일 / 509행\n\n### 주변 흐림 — 4484행\n\n- 영어: 미기재\n- 상태: 사용 가능\n- 원문 설명: 프레임 외곽을 의도적으로 소프트하게 처리해 분리감 확보\n- 이전 위치: 06_카메라 & 렌즈 / 108행\n\n### 블랙 프로미스트 1/4 시네마 블룸 — 5005행\n\n- 영어: 미기재\n- 상태: 보류\n- 원문 설명: 디지털의 날카로운 엣지를 누그러뜨리고 광원 주변에 몽환적이고 따뜻한 헤일로(빛번짐)를 형성하는 시네마 필터\n- 이전 위치: 08_셔터 & 피사계 심도 / 33행\n- 보류 사유: 원본행_미연결\n\n### 선명도/흐림 대비 — 5010행\n\n- 영어: Sharpness/Blur Contrast\n- 상태: 사용 가능\n- 원문 설명: 초점이 맞은 영역과 흐릿한 영역을 극적으로 대비시켜 특정 요소에 시선을 집중시킴.\n- 이전 위치: 08_셔터 & 피사계 심도 / 38행\n\n### 소프트 필터 — 5012행\n\n- 영어: Soft Filter\n- 상태: 사용 가능\n- 원문 설명: 부드럽고 은은한 색조로 포근한 느낌.\n- 이전 위치: 08_셔터 & 피사계 심도 / 40행\n\n### 시네블룸 10% 디퓨전 룩 — 5013행\n\n- 영어: 미기재\n- 상태: 보류\n- 원문 설명: 빛의 확산을 유도하여 대비를 낮추고 인물 피부의 잡티를 자연스럽게 완화하는 아티스틱 디퓨전 효과\n- 이전 위치: 08_셔터 & 피사계 심도 / 41행\n- 보류 사유: 원본행_미연결\n\n", "source": "round4_수업비교_20261021/texture_review_20261022/사진질감_엑셀검토.md"}, "ad7343146fdae099": {"name": "입자감_논문_1차탐색.md", "text": "# 사진 입자감 논문: 1차 탐색\n\n사진의 필름 그레인을 대상으로 탐색했다. 종이 표면의 질감을 뜻하는 경우 별도 탐색이 필요하다.\n\n공개 초록과 확인 가능한 원문 부분을 기준으로 정리했다. 전체 문헌고찰이나 메타분석이 아니다.\n\n## FG01 — Realistic Film Grain Rendering (2017)\n\n저자: Alasdair Newson, Noura Faraj, Bruno Galerne, Julie Delon (IPOL 페이지 표기 순서)\n\n출처: [Realistic Film Grain Rendering](https://www.ipol.im/pub/art/2017/192/)\n\n확인 위치: Abstract; PDF §1–2\n\n확인 범위: 학술지 페이지와 공개 PDF의 초록·도입·사진 과정 부분 직접 확인. 전체 정독 아님.\n\n내용: 사진 과정에 기반한 확률 모형과 Monte Carlo 렌더링을 제공한다. 해상도와 확대 배율에 대응한다.\n\n수업 적용 제안: 전체 화면과 같은 부위 확대본을 함께 비교하는 제작 방법의 참고 자료.\n\n해석 한계: 합성 알고리즘 연구이며, 그레인이 모든 이미지의 사실성이나 선호를 높인다는 실험 근거는 아니다.\n\n[공개 PDF](https://www.ipol.im/pub/art/2017/192/article_lr.pdf)\n\n## FG02 — Digital Image Improvement by Adding Noise: An Example by a Professional Photographer (2011)\n\n저자: Takehito Kurihara, Yoshitsugu Manabe, Naokazu Aoki, Hiroyuki Kobayashi\n\n출처: [Digital Image Improvement by Adding Noise: An Example by a Professional Photographer](https://library.imaging.org/jist/articles/55/3/art00006)\n\n확인 위치: Abstract\n\n확인 범위: 출판사 공개 초록 직접 확인. 유료 본문 미확보.\n\n내용: 한 전문 사진가의 흑백 노이즈 처리를 분석했다. 중간톤에 더 많은 노이즈가 나타나고 밝은 영역과 어두운 영역의 분포가 비대칭인 특성을 보고한다.\n\n수업 적용 제안: 균일한 노이즈와 밝기에 따라 달라지는 노이즈를 비교하는 참고 자료.\n\n해석 한계: 특정 사진가 사례의 분석이다. 모든 필름과 장면의 법칙으로 일반화하지 않는다.\n\n## FG03 — Analysis of User Preferences for Film Grain Noise in Images and Video Sequences (2024)\n\n저자: Xinyi Guo, Zhaojie Li, Daizong Tian, Kaixuan Zhang, Thrasyvoulos N. Pappas, Rene van Egmond, Huib de Ridder\n\n출처: [Analysis of User Preferences for Film Grain Noise in Images and Video Sequences](https://library.imaging.org/ei/articles/36/11/HVEI-230)\n\n확인 위치: Abstract\n\n확인 범위: 학회 출판 페이지의 초록 직접 확인. 본문과 표본 수·세부 자극 조건 미확보.\n\n내용: 정지 영상에서는 특정 중간 강도에서 필름 그레인을 백색 가우시안 노이즈보다 선호했다. 다른 강도에서는 뚜렷한 차이가 없었다. 비교한 노이즈 강도 간에는 약한 노이즈를 선호했고, 동영상에서는 무노이즈 조건을 두 그레인 조건보다 선호했다.\n\n수업 적용 제안: 입자감의 사실성·미적 선호·감정 적합성을 별도로 평가하는 설계의 참고 자료.\n\n해석 한계: 그레인은 항상 선호된다는 가설에 반대되는 근거다. 정지 이미지 결과와 동영상 결과를 혼용하지 않는다.\n\n## FG04 — Deep-based Film Grain Removal and Synthesis (2022)\n\n저자: Zoubida Ameur 외 (저자 목록은 arXiv 페이지 참조)\n\n출처: [Deep-based Film Grain Removal and Synthesis](https://arxiv.org/abs/2206.07411)\n\n확인 위치: Abstract; submission history v1 2022-06-15\n\n확인 범위: arXiv 초록 직접 확인. 본문 미정독. 여기서는 2022 프리프린트 버전을 인용한다.\n\n내용: 입자 제거용 인코더–디코더와 입자 합성용 조건부 GAN을 제안한다. 입력 강도로 그레인을 조절하는 합성을 보고한다.\n\n수업 적용 제안: 장면 생성과 그레인 합성을 분리하는 후처리 실험의 기술적 참고 자료.\n\n해석 한계: 영상 부호화 맥락의 기술 연구다. 현재 사용 중인 이미지 생성 모델을 검증한 논문은 아니다.\n\n## FG05 — Film grain synthesis technology for video applications — ITU-T H Suppl. 21 (2025)\n\n저자: ITU-T\n\n출처: [Film grain synthesis technology for video applications — ITU-T H Suppl. 21](https://www.itu.int/rec/dologin_pub.asp?id=T-REC-H.Sup21-202501-I!!PDF-E&lang=e&type=items)\n\n확인 위치: Summary; 목차 §6.2–6.5, §7–9\n\n확인 범위: 공식 PDF의 요약과 목차 직접 확인. 전체 기술 조항 미정독.\n\n내용: 그레인과 센서 노이즈의 제거·추정·파라미터화·합성·혼합을 정리한다.\n\n수업 적용 제안: 입자 효과의 입력과 처리 단계를 구분하는 기술 용어 참고 자료.\n\n해석 한계: 학술 논문이 아니라 정보 제공용 공식 기술 보충 문서다. 감정 효과를 입증하는 자료는 아니다.\n\n## 대안과 반대 근거\n\n- 가설 A: 약한 그레인이 특정 장면의 아날로그 인상에 기여할 수 있다. 생성·재현 가능성과 미적 선호를 구분한다.\n- 가설 B: 입자가 많으면 시청자가 손상이나 품질 저하로 읽을 수 있다. FG03은 그레인이 항상 선호된다는 주장에 반대 근거를 제공한다.\n- 가설 C: 실제 사진 느낌의 차이는 입자 외에 조명·피부·광학·색 처리에서 생길 수 있다. 이번 탐색은 이 원인을 비교 검증하지 않았다.\n\n## 다음 실험 제안\n\n같은 원본에 입자 없음·약한 그레인·강한 그레인·가우시안 노이즈를 적용한다.\n밝기별 분포와 입자 크기는 별도 변수로 둔다.\n화면 크기와 확대 배율을 고정한다.\n평가자는 사실성·선호도·감정 적합성을 각각 평가한다.\n이 실험 제안은 문헌을 참고한 설계이며 이미 검증한 결과가 아니다.\n", "source": "round4_수업비교_20261021/texture_review_20261022/입자감_논문_1차탐색.md"}, "6a0fc764d4e3eb5f": {"name": "프린트입자감_자료와수업적용.md", "text": "# 프린트의 입자감과 종이 질감\n\n2026-10-22. 필름 그레인과 인쇄물의 질감을 구분하기 위한 1차 탐색이다.\n\n| 구분 | 관찰할 모습 | 비교할 요소 |\n|---|---|---|\n| 종이 표면의 결 | 섬유와 요철, 펠트 무늬 | 무광·유광, 매끈한 종이·거친 종이 |\n| 하프톤 망점 | 톤을 구성하는 인쇄 점의 구조 | 점의 크기·배열·망선수 |\n| 인쇄 입자감 | 미세한 농도·색의 불균일 | 잉크·토너, 용지, 출력 조건 |\n| 모틀링 | 더 넓게 보이는 얼룩 | 넓은 단색 면의 균일성 |\n| 표면 반사 | 광택과 관찰 각도에 따른 변화 | 조명의 방향과 보는 각도 |\n\n위 분류는 수업을 위한 종합이다. 모든 항목을 필름 그레인과 같은 효과로 처리하지 않는다.\nPR02는 graininess와 mottle을 공간 주파수 기준으로 구분하고 용지·망선수 조건을 비교한다.\n인쇄 망점은 톤을 구성하는 구조이며, 불규칙한 인쇄 노이즈와 구분해서 관찰해야 한다.\n\n## 수업 비교 제안\n\n같은 사진을 무광 매끈한 종이, 거친 파인아트 종이, 유광 사진용지에 출력한다.\n인쇄 방식 비교는 별도 실험으로 진행한다. 종이와 인쇄 방식을 동시에 바꾸면 원인을 분리하기 어렵다.\n전체 출력물과 동일 부위 확대본, 비스듬한 조명에서 촬영한 종이 표면을 함께 기록한다.\n화면 스캔만으로 촉감과 반사 특성 전체를 판단하지 않는다.\nAI의 종이 질감 생성은 시각적 모사다. 실제 출력물의 촉감이나 인쇄 성능을 검증한 결과가 아니다.\n\n## 확인한 원문과 적용 범위\n\n### PR01 — Image Graininess via Flatbed Scanner and Image Segmentation\n\nChunghui Kuo; Yee S. Ng\n\n[원문](https://library.imaging.org/admin/apis/public/api/ist/website/downloadArticle/print4fab/21/1/art00027_1)\n\n확인 위치: PDF p.1 Abstract\n\n인쇄 이미지에서 입자감을 평가하기 위한 스캐너·영상 분할 접근. 본문 전체 정독과 연도 확인은 미완료.\n\n### PR02 — Analyzing Print Quality of Large Printed Area of Toner-based Press\n\nYingmei Zhou; Xiaoying Rong, 2012\n\n[원문](https://library.imaging.org/admin/apis/public/api/ist/website/downloadArticle/print4fab/28/1/art00067_1)\n\n확인 위치: PDF pp.1–3, Abstract/Experimental/Graininess\n\nHP Indigo 5500의 용지와 망선수 조건을 비교한다. 미세한 농도 불균일과 큰 얼룩을 구분한다. 다른 인쇄 방식에 결과를 그대로 일반화하지 않는다.\n\n### PR03 — German Etching\n\nHahnemühle 공식\n\n[원문](https://www.hahnemuehle.com/en/digital-papers/fineart-collection/glossy-fineart/p/Product/show/5/13.html)\n\n확인 위치: 제품 설명과 표면 사양\n\n뚜렷한 펠트 구조가 있는 무광 파인아트 잉크젯 용지. 설명은 제조사 제품 사양이며 감정 효과를 입증하는 논문이 아니다.\n\n### PR04 — Select the Perfect Paper Type\n\nCanon 공식\n\n[원문](https://ij.manual.canon/ij/webmanual/Manual2/UF/uf_various_paper.html?lng=en&mdl=PRO-310&os=m)\n\n확인 위치: 용지 선택 안내\n\n사진 출력에서 용지 종류·색·질감에 따라 인상이 달라지는 선택 기준.\n\n### PR05 — Micro-uniformity/graininess\n\nCanon Colorado M-series 공식\n\n[원문](https://docs.cpp.canon/help?pageid=GUID-E9626763-6EAA-4EA8-8972-5E735B6BC299.xml&tsm=ODP000168-4.4.1EN.US)\n\n확인 위치: Introduction/Procedure\n\n잉크 방울의 불균일 분포와 합쳐짐 등이 인쇄 입자감으로 보일 수 있음을 설명한다. 특정 프린터의 문제 해결 자료다.\n\n## 대안과 미확인\n\n거친 종이가 표현에 도움이 될 수도 있고, 미세 묘사를 읽기 어렵게 만들 수도 있다.\n인쇄 불균일은 의도한 분위기로 활용할 수도 있으나 품질 결함으로 읽힐 수도 있다.\n실제 종이 샘플의 비교 촬영과 재질별 확대 사진은 이번 작업에서 새로 수집하지 않았다.\n", "source": "round4_수업비교_20261021/texture_review_20261022/프린트입자감_자료와수업적용.md"}};function show(){let k=location.hash.slice(1);document.getElementById("list").innerHTML=Object.entries(docs).map(([id,d])=>`<p><a href="#${id}">${d.name}</a></p>`).join("");if(docs[k]){document.getElementById("title").textContent=docs[k].name;document.getElementById("text").innerHTML=docs[k].text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\[([^\]]+)\]\((https?:[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');document.getElementById("list").style.display="none"}else document.getElementById("list").style.display="block"}window.onhashchange=show;show()</script><style>.poster{scroll-margin-top:110px}nav:not(.site-nav){position:relative!important;top:auto!important;max-width:1560px;width:calc(100% - 32px)}.controls{position:relative!important}</style><style>*,*::before,*::after{box-sizing:border-box}</style><style>pre{overflow-wrap:anywhere}.flow{flex-wrap:wrap}.support{max-width:1560px;width:calc(100% - 32px);overflow:auto}</style>
