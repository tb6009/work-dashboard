Art and Design, is a private arts university in Uiwang, Gyeonggi, South Korea. It offers programs in design, media, and fine arts at its... 더 보기\n계원예술대학교 lms\nkaywon_univ\n138.9만\n요즘 꼴, 좋습니다.\n\n사진예술과 송가언 학생의 졸업작품 〈꼴〉을 통해 ‘세상의 모양’을 탐구하는 독특한 시선을 만나보세요.\n\n명리학을 사진으로 풀어낸 작업 과정부터 사진예술과 입시 팁, 장비 이야기까지 생생하게 담았습니다.\n\n요즘 주목하는 ‘꼴’은 무엇인가요?\n나만의 시선을 계원예대에서 키워보세요.\nwhiteamas\n359\n집에서 5분거리에 #계원예술대학교 가 있다\n\n오늘은 축제날\n\n내 마음은 20대 초반이다~~🤭\n\n#의왕\n#크라잉넛\n#계원예대\n#오늘도감사합니다\nopushaus.seoul\n5.9만\n#졸업작품 \n▪️이규헌 (계원예술대학교, 가구리빙디자인과, ’24졸업작업) \n- 얼굴 (2024)\n- (1) : 400 X 280 X 600 (2) 400 X 300 X 700 mm\n- MDF, 우레탄\n- 2,500,000원 \n누구나 자신만의 “얼굴” 뒷면에는 또 다른 공간을 가지고 있으며 그 속에는 누구도 알지 못하는 것들을 감출 수 있습니다.  그리고 그 속은 비우거나 채울 수 있습니다. (얼굴과 서랍을 조합한 아트 퍼니처)\n\n-\n🏡 OPUSHAUS | ART FIRM\n졸업작품을, 세상에 \n#졸업전시 #졸업 #전시 #졸전 #졸작 #가구 #가구인테리어 #가구디자인\ndanchoo.webzine\n💌 지난 11월 21일, 계원예술대학교에서 열린\n졸업전시회 조형제에 단추웹진 에디터들이 다녀왔습니다.\n\n🤚🏻 11월 19일부터 단 하루, 자신의 졸업작품을\n알리고 싶은 학생들을 대상으로\n인터뷰이를 모집했는데요.\n\n졸업전시가 얼마 남지 않은 시점에도\n정성스럽게 구글폼을 작성해 인터뷰를 신청한\n광고브랜드디자인과 남궁도현 학생을 소개합니다.\n\n⛓️‍ 남궁도현 학생의 졸업작품은\n현대 사회에서 점점 멀어지는 감정의 거리를\n조명한 작품입니다. ‘연결’의 의미를\n다시 생각해보게 만드는 전시를\n지금 바로 만나보세요.\n\n🅠¹ 간단한 자기소개\n🄰 안녕하세요! 계원예술대학교 광고브랜드디자인학과\n졸업 예정인, 25살 남궁도현 입니다.\n\n🅠² 작품 소개\n🄰 저의 졸업작품 프로젝트명은 ‘배선용 꽂음 접속기’로,\n오늘날 우리는 그 어느 때보다 잘 연결되어 있지만,\n정작 마음의 거리는 점점 멀어지고 있습니다.\n현대사회의 역설적인 관계 속에서 감정의 단절을\n다시 바라보고자 만들게 되었습니다.\n\n🅠³ 앞으로의 행보\n🄰 누구나 공감하며 즐길 수 있는\n새로운 형태의 복합문화를 이끌어가기 위한\n팀을 창설하여 인터랙션, 인테리어, 브랜딩 등\n다양한 프로젝트를 진행하고자 합니다.\n\n벌써부터 졸업작품으로 ‘퍼스널 브랜딩’을 완성한\n남궁도현 학생이 앞으로 어떤 이야기로\n작업을 이어나갈지 진심으로 응원하며,\n여러분의 많은 관심도 부탁드립니다.\n\n➢ 남궁도현 학생 Contact\n¹ Instagram | @negeulja_\n² Mail | nqdoln@gmail.com\n\nCredit Ⓒdanchoo.webzine\n@negeulja_\n\nCategory { INTERVIEW }\n\n-\n\n#인터렉티브전시 #전시회 #조형제 #계원예술대학교\n#인터뷰 #학생 #삼성전자 #참여형전시 #편집디자인\n#팟캐스트 #영상디자인 #졸업작품 #전시 #졸작\ndesigncloud_g...\n9.6만\n<디클 인터뷰 EP.27>\n⠀\n@s0_.myeong\n⠀\n계원예술대학교 시각디자인학과 졸업작품전에서 [옛 글자 골격 분석 연구]의 디자이너님을 인터뷰 했습니다👏\n⠀\n다음 인터뷰에는 홍익대학교 시각디자인과 학생들의 인터뷰가 여러분을 찾아갑니다. 기대해주세요!\n⠀\n졸전 스토리를 듣고 싶은 디자이너가 있다면 <댓글에 태그>를 남겨 저희 =false", "id": "SNS018", "at": "2026-11-13T00:17:49.887Z", "url": "https://blog.naver.com/yoonaac", "kind": "태그 목록", "department": "광고·브랜드디자인과", "group": "학생 자기보고", "note": "작성자 블로그 안의 태그 목록 3건. 플랫폼 전체 게시물 수가 아님.", "label": "학생 블로그의 #계원예대 목록", "superseded": false}, {"title": "yoonaac님의 블로그 : 네이버 블로그", "text": "NAVER\n블로그\nyoonaac님의 블로그\n블로그 검색\n이 블로그에서 검색\n  \n \n공감 0\n첫 댓글을 남겨보세요 \n공유하기\n메뉴 바로가기\n본문 바로가기\n내 블로그 \n이웃블로그 \n블로그 홈 \n로그인\n사용자 링크\nyoonaac님의 블로그\n블로그 메뉴\n 프롤로그\n 블로그\n\t\n 지도\n 서재\n 안부\n블로그\n\t\t\n\t\n게시판 3개의 글\n게시판\n목록열기\n\t\n\t\t\n\t\t\n\t\n게시판\n\n계원예술 대학교 광고브랜드워크숍 [계원예대 앞 골목상권 리브랜딩 프로젝트]\n\n yoonaac ・ 2025. 12. 9. 21:30\nURL 복사  이웃추가\n \n본문 기타 기능\n\n안녕하세요.\n\n계원예술대학교 광고브랜드디자인과 1학년에 재학중인 안윤아, 최윤아입니다!\n\n​\n\n저희는 이번에 광고브랜드워크숍 수업에서 [계원예대 앞 골목상권 리브랜딩 프로젝트]를 진행했습니다.\n\n​\n\n이 프로젝트는 계원예대 주변 상권들과 학생들이 협업하여 가게와 골목상권을 살리자는 취지에서 리브랜딩을 진행하는\n\n프로젝트입니다.\n\n​\n\n저희 팀은 청라요가를 맡게 되었습니다.\n\n청라요가는 전문적이고 힐링 테라피와 맞춤형 요가 가 중심인 전통 요가원입니다!\n\n1학년 2학기 중간과 기말로 나눠서 장기 프로젝트를 진행했는데요,\n\n1-2주차 : 데스크리서치\n\n3주차 : 필드리서치\n\n4주차 - 5주차 : 사장님/강사님/고객님 인터뷰\n\n6주차 - 8주차 : 문제점 파악 및 솔루션 제시\n\n​\n\n9주차 : 로고 초안 및 솔루션 기획\n\n10주차 : 솔루션 세부적 기획\n\n11주차 : 로고 수정 + 솔루션 기획 \n\n12주차 : 솔루션 레퍼런스 + 촬영 기획\n\n13주차 : 사진&릴스 촬영 / 블로그 작성 / 인스타그램 게시물 기획\n\n14주차 : 프로젝트 최종 정리\n\n​\n\n전체적으로,\n\n중간 --> 자료조사\n\n기말 --> 솔루션 기획 및 실행\n\n​\n\n솔루션\n\n로고 리디자인\n\nSNS (인스타그램/블로그) 관리\n\n사진&릴스 촬영\n\n창문 외벽 시트지 리디자인\n\n으로 기획 후 진행했습니다.\n\n​\n\n프로젝트를 통해 좋은 인연으로 사장님과 만나, 많은 이야기를 나눌 수 있었습니다.\n\n​\n\n청라요가는 맞춤형 요가를 중점으로 '누구나 쉽고 재밌게 할 수 있는 요가'라는 신념을 갖고\n\n운영 중인 전문 요가원입니다.\n\n​\n\n청라요가 고객님들의 원하는 [부분적 통증 완화 / 맞춤형 요가]와\n\n거북목&손목 통증 완화를 원하는 계원예대 학생들의 니즈를 파악할 수 있었습니다.\n\n​\n\n그래서 저희는 '맞춤형 요가'를 중점으로 로고와 시트지를 리디자인 했습니다.\n\n로고는 힐링과 자유로움, 세련된 이미지를 담아봤습니다.\n\n메인로고\n\n로고 컬러시스템\n\n​\n\n​\n\n창문 외벽 시트지는 3층이라는 위치 상 눈에 잘 띌 수 있게 컬러포인트와 로고 중심으로 제작했습니다.\n\n​\n\n창문 외벽 시트지 디자인\n\n​\n\nSNS 솔루션 진행한 인스타그램 게시물과 릴스도 함께 업로드 했습니다.\n\n​\n\n​\n\n이 프로젝트를 청라요가와 함께 진행하면서,\n\n요가라는 키워드에 맞게 '어떤 이미지로 재정립하고, 어떤 방향으로 마케팅을 해야 청라요가를 돋보이게 할 수 있을지'에\n\n대한 고민을 생각해볼 수 있는 시간이었습니다.\n\n​\n\n데스크리서치부터 마지막 솔루션 시안 제작까지 모든 작업에 참여하면서 정말 많은 걸 배울 수 있었습니다.\n\n현장 실습이라는 값진 경험 뿐만 아니라, 사장님과 함께 의견을 조율하고 아이디어를 공유하는 커뮤니케이션 방법에\n\n대해서도 꺠달은 점이 많았습니다.\n\n​\n\n기술적인 부분 뿐만 아니라, 소통의 영역도 중요한 역할을 한다는 것이 이번 프로젝트를 하며 얻은 깨달음 중\n\n가장 중요한 포인트가 아닐까 싶습니다.\n\n​\n\n이 프로젝트를 발판 삼아 이 감정과 경험을 기억하며 앞으로 더 나아갈 수 있을 거 같다는 용기도 얻었습니다.\n\n​\n\n이런 뜻깊은 경험을 제공해주신 광고브랜드워크숍 김남형 교수님과 청라요가 사장님께 감사 인사 드립니다!\n\n \n공감 0\n  \n이 글에 공감한 블로거 열고 닫기\n 댓글 쓰기  \n이 글에 댓글 단 블로거 열고 닫기\n블로그 보내기\n카페 보내기\nKeep 보내기\n메모 보내기\n기타 보내기 펼치기\n인쇄\n\t\n\t\t\n\t\t\n\t\n이 블로그 게시판 카테고리 글\n전체글 보기\n게시판글 목록\n글 제목\n\t\n작성일\n화면 최상단으로 이동\n\t\n\t\t\n\n \n\n \n\n \n\n \n\n \n\n \n\n \n\n \n\n \n\n \n\n \n\n \n\n활동정보\n\n \n\n \n\n \n\n \n\n \n\n \n\n \n\nRSS 2.0\nRSS 1.0\nATOM 0.3\n검색\n글 검색\n ", "links": [{"href": "http://www.naver.com/", "text": "NAVER"}, {"href": "https://blog.naver.com/", "text": "블로그"}, {"href": "https://blog.naver.com/PostList.naver?blogId=yoonaac", "text": "yoonaac님의 블로그"}, {"href": "https://blog.naver.com/PostView.naver?blogId=yoonaac&logNo=224104010152&redirect=Dlog&widgetTypeCall=true&noTrackingCode=true&directAccess=false#", "text": ""}, {"href": "https://blog.naver.com/PostView.naver?blogId=yoonaac&logNo=224104010152&redirect=Dlog&widgetTypeCall=true&noTrackingCode=true&directAccess=false#", "text": "  "}, {"href": "https://blog.naver.com/PostView.naver?blogId=yoonaac&logNo=224104010152&redirect=Dlog&widgetTypeCall=true&noTrackingCode=true&directAccess=false#", "text": ""}, {"href": "https://blog.naver.com/PostView.naver?blogId=yoonaac&logNo=224104010152&redirect=Dlog&widgetTypeCall=true&noTrackingCode=true&directAccess=false#ratingbutton-like", "text": "\n\t\t\t\t\t\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\t\t\t\t\t공감\n\t\t\t\t\t\t\t\t\t\t\t\t\t0\n\t\t\t\t\t\t\t\t\t\t\t\t"}, {"href": "https://blog.naver.com/PostView.naver?blogId=yoonaac&logNo=224104010152&redirect=Dlog&widgetTypeCall=true&noTrackingCode=true&directAccess=false#ratingbutton-impressive", "text": "\n\t\t\t\t\t\t\t\t\t\t\t\t\t\n\t\t\t\t\t\t\t\t\t\t\t\
