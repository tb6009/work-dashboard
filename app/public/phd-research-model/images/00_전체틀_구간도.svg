<svg xmlns="http://www.w3.org/2000/svg" width="1172" height="404" viewBox="-16 -16 1172.0 404.0" role="img" aria-label="구성개념 일곱 개의 사슬과 그 위에 세 편의 논문이 덮는 범위를 보여주는 구간도"><rect x="-16" y="-16" width="1172" height="404" fill="#FFFFFF"/>
        <g font-family="ui-monospace, 'SF Mono', Menlo, monospace">

          <!-- 세로 가이드 -->
          <g stroke="#D6DEDB" stroke-width="1" stroke-dasharray="2 5">
            <line x1="40" y1="104" x2="40" y2="344"/>
            <line x1="192" y1="104" x2="192" y2="344"/>
            <line x1="344" y1="104" x2="344" y2="344"/>
            <line x1="496" y1="104" x2="496" y2="344"/>
            <line x1="648" y1="104" x2="648" y2="344"/>
            <line x1="800" y1="104" x2="800" y2="344"/>
            <line x1="952" y1="104" x2="952" y2="344"/>
            <line x1="1088" y1="104" x2="1088" y2="344"/>
          </g>

          <!-- 스파인 chips -->
          <g>
            <rect x="40" y="34" width="136" height="54" rx="3" fill="#F0E2DD" stroke="#A0402B" stroke-width="1.3"/>
            <text x="54" y="54" font-size="10.5" fill="#A0402B">AAX</text>
            <text x="54" y="74" font-size="14" font-weight="700" fill="#15191B" font-family="'Apple SD Gothic Neo',system-ui,sans-serif">AI 불안</text>

            <rect x="192" y="34" width="136" height="54" rx="3" fill="#E9EEEC" stroke="#D6DEDB" stroke-width="1.3"/>
            <text x="206" y="54" font-size="10.5" fill="#7E888A">USE</text>
            <text x="206" y="74" font-size="14" font-weight="700" fill="#15191B" font-family="'Apple SD Gothic Neo',system-ui,sans-serif">AI 사용 수준</text>

            <rect x="344" y="34" width="136" height="54" rx="3" fill="#E9EEEC" stroke="#D6DEDB" stroke-width="1.3"/>
            <text x="358" y="54" font-size="10.5" fill="#7E888A">TC · SC</text>
            <text x="358" y="74" font-size="14" font-weight="700" fill="#15191B" font-family="'Apple SD Gothic Neo',system-ui,sans-serif">과업·스킬 크래프팅</text>

            <rect x="496" y="34" width="136" height="54" rx="3" fill="#E9EEEC" stroke="#D6DEDB" stroke-width="1.3"/>
            <text x="510" y="54" font-size="10.5" fill="#7E888A">TV · SV</text>
            <text x="510" y="74" font-size="14" font-weight="700" fill="#15191B" font-family="'Apple SD Gothic Neo',system-ui,sans-serif">업무 다변화</text>

            <rect x="648" y="34" width="136" height="54" rx="3" fill="#E9EEEC" stroke="#D6DEDB" stroke-width="1.3"/>
            <text x="662" y="54" font-size="10.5" fill="#7E888A">LOAD</text>
            <text x="662" y="74" font-size="14" font-weight="700" fill="#15191B" font-family="'Apple SD Gothic Neo',system-ui,sans-serif">인지부하</text>

            <rect x="800" y="34" width="136" height="54" rx="3" fill="#E9EEEC" stroke="#D6DEDB" stroke-width="1.3"/>
            <text x="814" y="54" font-size="10.5" fill="#7E888A">PERF</text>
            <text x="814" y="74" font-size="14" font-weight="700" fill="#15191B" font-family="'Apple SD Gothic Neo',system-ui,sans-serif">업무 성과</text>

            <rect x="952" y="34" width="136" height="54" rx="3" fill="#E9EEEC" stroke="#4B5558" stroke-width="1.5"/>
            <text x="966" y="54" font-size="10.5" fill="#7E888A">REW</text>
            <text x="966" y="74" font-size="14" font-weight="700" fill="#15191B" font-family="'Apple SD Gothic Neo',system-ui,sans-serif">보상 적정성</text>
          </g>

          <!-- CC, 스파인 아래 우회 -->
          <rect x="344" y="112" width="136" height="50" rx="3" fill="#DCEAE8" stroke="#116260" stroke-width="1.3"/>
          <text x="358" y="131" font-size="10.5" fill="#116260">CC</text>
          <text x="358" y="150" font-size="14" font-weight="700" fill="#15191B" font-family="'Apple SD Gothic Neo',system-ui,sans-serif">인지 크래프팅</text>
          <text x="494" y="143" font-size="11" fill="#116260" font-family="'Apple SD Gothic Neo',system-ui,sans-serif">다변화를 우회하는 경로</text>

          <!-- 구간 막대 -->
          <g>
            <rect x="40" y="192" width="592" height="38" rx="3" fill="#E9EEEC" stroke="#15191B" stroke-width="1.5"/>
            <text x="56" y="216" font-size="13.5" font-weight="700" fill="#15191B" font-family="'Apple SD Gothic Neo',system-ui,sans-serif">1편 · 갈림 <tspan fill="#4B5558" font-weight="400">— 누가 일을 넓히는가</tspan></text>
            <text x="620" y="216" font-size="11" fill="#116260" text-anchor="end">우산 : GAIL</text>

            <rect x="496" y="242" width="592" height="38" rx="3" fill="#E9EEEC" stroke="#15191B" stroke-width="1.5"/>
            <text x="512" y="266" font-size="13.5" font-weight="700" fill="#15191B" font-family="'Apple SD Gothic Neo',system-ui,sans-serif">2편 · 대가 <tspan fill="#4B5558" font-weight="400">— 넓힌 값은 치러지는가</tspan></text>
            <text x="1076" y="266" font-size="11" fill="#116260" text-anchor="end">우산 : 업무 숙련도</text>

            <rect x="40" y="292" width="440" height="38" rx="3" fill="#DCEAE8" stroke="#116260" stroke-width="1.5"/>
            <text x="56" y="316" font-size="13.5" font-weight="700" fill="#15191B" font-family="'Apple SD Gothic Neo',system-ui,sans-serif">3편 · 조건 <tspan fill="#4B5558" font-weight="400">— 무엇이 정의를 바꾸게 하는가</tspan></text>
            <text x="468" y="316" font-size="11" fill="#116260" text-anchor="end">우산 : 심리적 안전감</text>
          </g>

          <text x="40" y="360" font-size="11" fill="#7E888A" font-family="'Apple SD Gothic Neo',system-ui,sans-serif">막대가 겹치는 구간이 공유 변수다. 겹침 자체는 문제가 아니고, 겹친 변수를 같은 질문으로 두 번 쓰는 것이 문제다.</text>
        </g>
      </svg>