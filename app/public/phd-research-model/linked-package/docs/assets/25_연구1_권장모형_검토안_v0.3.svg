<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
<title id="title">연구 1 권장모형 v0.3 — 채택 전 검토안</title>
<desc id="desc">USE에서 TC로, TC에서 TP·JE·WI로 향하는 주경로. USE의 세 결과 직접경로와 EXP의 세 결과 주효과를 포함한다. GAIL은 USE–TC 경로의 조절 후보이며 GAIL의 TC 주효과도 추정한다. EXP 조절은 별도 탐색 후보, 소득 영향은 보조 분석이다.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#253544"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#6b7c8c"/></marker></defs>
