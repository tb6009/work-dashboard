<text x="70" y="130" font-size="40" font-weight="700">AI 사용, 과업 크래프팅과 업무 결과</text>
<text x="70" y="171" font-size="23" fill="#617181">v0.3 권장 검토안 · 모형 채택 및 설문 검증 전</text>
