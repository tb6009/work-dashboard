<g font-size="32" font-weight="700"><text x="230" y="527">USE</text><text x="740" y="527">TC</text><text x="1240" y="335">TP</text><text x="1240" y="525">JE</text><text x="1240" y="715">WI · IDS</text><text x="740" y="264">GAIL</text><text x="1645" y="512">EXP</text></g>
<g font-size="23"><text x="230" y="566">업무상 생성형 AI 사용</text><text x="740" y="566">과업 크래프팅 행동</text><text x="1240" y="374">AI의 지각된 생산성 기여</text><text x="1240" y="562">담당 과업범위의 지각된 확대</text><text x="1240" y="754">업무강도 증가</text><text x="740" y="300">생성형 AI 리터러시</text><text x="1645" y="551">자기평가</text><text x="1645" y="580">직업 전문성</text></g>
</g>
<g font-size="19" fill="#617181"><text x="86" y="237">USE → 세 결과 직접경로 포함</text><text x="427" y="419">조절 후보</text><text x="801" y="390">주효과</text><text x="1460" y="420">EXP → 세 결과 주효과</text><text x="1090" y="631">JE: 연구자 작성 후보 · 문항 검증 필요</text><text x="590" y="648">현 TC는 확장·도전 행동 중심</text><text x="590" y="678">일반적인 재설계 전체로 해석하지 않음</text></g>
<rect x="70" y="910" width="1660" height="105" rx="8" fill="#f3f5f7"/>
<text x="95" y="947" font-size="24" font-weight="700">INC_AI · 지각된 소득 영향 — 별도 보조 분석</text>
<text x="95" y="985" font-size="21">TP·JE·WI와의 동반 분포·관련성 확인. 핵심 결과에서 소득으로 이어지는 인과경로는 지정하지 않음.</text>
<text x="70" y="1060" font-size="20">굵은 실선: 주경로   가는 실선: 직접경로·주효과   점선: 조절 후보</text>
<text x="70" y="1097" font-size="20">EXP × TC의 세 조절효과는 사전 지정한 탐색 후보. GAIL의 우선 배치도 이론 검토가 필요함.</text>
<text x="70" y="1134" font-size="20">화살표는 제안된 분석 방향. 횡단자료의 인과·완전매개를 뜻하지 않음. 결과 간 잔차 공분산은 분석에서 검토.</text>
</g></svg>
